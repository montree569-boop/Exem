<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#738096;--line:#e5eaf2;--brand:#4f46e5;--brand2:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{min-height:100vh}.sidebar{width:250px;background:#11182b;color:#e8ecf8;position:fixed;inset:0 auto 0 0;padding:24px 16px;display:flex;flex-direction:column;z-index:10}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#818cf8,#6d28d9);display:grid;place-items:center;color:white;font-size:20px;font-weight:800}.navitem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;color:#aab4cb;font-size:14px;margin:3px 0;text-align:left;width:100%;background:transparent;border:0}.navitem.active,.navitem:hover{background:#252e49;color:white}.main{margin-left:250px;min-height:100vh}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.content{padding:30px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px #26365a08}.btn{border:0;border-radius:11px;padding:10px 15px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center;justify-content:center}.primary{background:var(--brand);color:#fff}.primary:hover{background:#4338ca}.soft{background:#eef2ff;color:#4338ca}.neutral{background:#f1f4f9;color:#344054}.danger{background:#fff0f0;color:#c24141}.field{width:100%;border:1px solid #dce3ee;border-radius:11px;padding:11px 12px;background:#fff;outline:none;font-size:14px}.field:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f11c}.label{display:block;font-size:12px;font-weight:600;color:#59657a;margin:0 0 6px}.muted{color:var(--muted)}.stat{padding:20px}.statnum{font:800 27px Manrope,sans-serif;letter-spacing:-1px}.pill{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eef2ff;color:#4f46e5}.divider{border-top:1px solid var(--line)}.question-card{border:1px solid #e0e6f0;border-radius:16px;padding:18px;background:#fff}.option-row{display:flex;align-items:center;gap:10px;border:1px solid #e1e6ef;border-radius:10px;padding:10px;margin-top:8px}.option-row input{accent-color:#4f46e5}.builder-toolbar{display:flex;flex-wrap:wrap;gap:8px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:white;padding:13px 18px;border-radius:12px;z-index:100;box-shadow:0 12px 35px #0002}.modal{position:fixed;inset:0;background:#11182788;backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.modalbox{background:white;border-radius:20px;width:min(850px,100%);max-height:92vh;overflow:auto;padding:24px}.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:white}.login-art{background:radial-gradient(circle at 20% 15%,#6366f1 0,#252d6b 36%,#11182b 80%);color:white;padding:7vw;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.login-art:after{content:"";position:absolute;width:480px;height:480px;border:1px solid #ffffff24;border-radius:50%;right:-130px;bottom:-130px;box-shadow:0 0 0 55px #ffffff08,0 0 0 110px #ffffff06}.login-form{display:flex;align-items:center;justify-content:center;padding:30px}.login-box{width:min(410px,100%)}.student-shell{max-width:920px;margin:0 auto;padding:26px 18px}.progress{height:6px;background:#e8ecf5;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6)}.exam-option{border:1px solid #e0e6f0;padding:14px;border-radius:12px;display:flex;gap:12px;align-items:flex-start;margin-top:9px;cursor:pointer}.exam-option:has(input:checked){border-color:#818cf8;background:#f5f5ff}.exam-option input{margin-top:5px;accent-color:#4f46e5}.image-preview{max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:13px 15px;text-align:left;border-bottom:1px solid #edf0f5;white-space:nowrap}th{font-size:11px;color:#78849a;background:#fafbfe;font-weight:700}td{color:#344054}@media(max-width:850px){.sidebar{width:68px;padding:20px 8px}.sidebar .brandtext,.sidebar .navlabel,.sidebar .navitem span,.sidebar .sidefoot{display:none}.sidebar .navitem{justify-content:center;padding:13px 0}.main{margin-left:68px}.content{padding:18px}.topbar{padding:0 18px}.login-wrap{grid-template-columns:1fr}.login-art{display:none}}@media(max-width:520px){.content{padding:12px}.topbar{height:65px}.statnum{font-size:23px}}
</style>
<style>.ef-watermark-wrap{isolation:isolate}.ef-watermark{position:absolute;z-index:5;inset:-10%;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;transform:rotate(-24deg);font-size:clamp(28px,5vw,58px);font-weight:900;letter-spacing:3px;line-height:2.1;color:rgba(100,116,139,.12);text-shadow:none;word-break:break-word;opacity:1;mix-blend-mode:multiply}.ef-watermark-wrap>*:not(.ef-watermark){position:relative;z-index:6}.ef-watermark:before{content:'ตัวอย่างข้อสอบ · EXAMFLOW · ตัวอย่างข้อสอบ · EXAMFLOW';position:absolute;inset:-20%;display:block;white-space:normal;overflow-wrap:anywhere;line-height:2.3;word-spacing:12px;transform:scale(1.25)}.ef-watermark{font-size:0}.ef-watermark:before{font-size:clamp(28px,5vw,58px);color:rgba(100,116,139,.13)}</style></head>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let cloudReady=false, fbApp=null, fbAuth=null, fbDb=null, fbUser=null, cloudMeta=null, cloudOrgIds=[], activeDbListeners=[];
const write=(k,v)=>{localStorage.setItem(k,JSON.stringify(v)); if(cloudReady) cloudWrite(k,v).catch(err=>{console.error('Firebase write failed',k,err);toast('บันทึกฐานข้อมูลไม่สำเร็จ: '+(err.message||'ตรวจสอบสิทธิ์ Firebase'))});};
const firebaseConfig={apiKey:'AIzaSyBm7UAxOOk-nKTHmaE1vbDpV77-2TzpxL8',authDomain:'education-d4a35.firebaseapp.com',databaseURL:'https://education-d4a35-default-rtdb.firebaseio.com/',projectId:'education-d4a35',storageBucket:'education-d4a35.firebasestorage.app',messagingSenderId:'120666073519',appId:'1:120666073519:web:35028bd4da5df6f1b2e75a',measurementId:'G-8YWZ0QPVJ7'};
try{fbApp=firebase.initializeApp(firebaseConfig);fbAuth=firebase.auth();fbDb=firebase.database()}catch(e){console.error('Firebase init error',e)}
function objFromArray(a){const o={};(a||[]).forEach(x=>{if(x&&x.id)o[x.id]=x});return o}
function vals(v){return v?Object.values(v):[]}
function safeUser(u){const x={...u};delete x.password;return x}
async function cloudWrite(key,value){if(!fbDb||!fbUser||!cloudReady)return;const arr=Array.isArray(value)?value:[];const old=read('ef_cloud_snapshot_'+key,[]);const pathFor=(x)=>x.orgId||session?.orgId||cloudMeta?.orgId||'';
 if(key==='ef_orgs'){if(cloudMeta?.role!=='superadmin')throw Error('เฉพาะผู้ดูแลระบบหลักแก้ไขสถาบันได้');await fbDb.ref('organizations').set(objFromArray(arr));cloudOrgIds=arr.map(x=>x.id);}
 else if(key==='ef_users'){
   for(const u of arr){if(!u.id)continue;if(cloudMeta?.role==='orgadmin'&&u.role!=='teacher')continue;const clean=safeUser(u);await fbDb.ref('users/'+u.id).update(clean);if(u.orgId)await fbDb.ref('orgUsers/'+u.orgId+'/'+u.id).update(clean)}
   for(const u of old){if(cloudMeta?.role==='orgadmin'&&u.role!=='teacher')continue;if(u.id&&!arr.some(n=>n.id===u.id)){const deleted={...safeUser(u),status:'deleted',deletedAt:Date.now()};await fbDb.ref('users/'+u.id).update(deleted);if(u.orgId)await fbDb.ref('orgUsers/'+u.orgId+'/'+u.id).update(deleted)}}
 }
 else if(key==='ef_exams'||key==='ef_results'){
   const node=key==='ef_exams'?'exams':'results';
   for(const item of arr){let oid=pathFor(item);if(!oid&&key==='ef_results'){const ex=read('ef_exams',[]).find(e=>e.id===item.examId);oid=ex?.orgId||'';if(oid)item.orgId=oid}if(!oid)continue;await fbDb.ref(`orgData/${oid}/${node}/${item.id}`).set(item)}
   for(const item of old){if(!arr.some(n=>n.id===item.id)){let oid=pathFor(item);if(!oid&&key==='ef_results'){const ex=read('ef_exams',[]).find(e=>e.id===item.examId);oid=ex?.orgId||item.orgId||''}if(oid)await fbDb.ref(`orgData/${oid}/${node}/${item.id}`).remove()}}
 }
 localStorage.setItem('ef_cloud_snapshot_'+key,JSON.stringify(arr));
}
function bindOrgListeners(orgIds){for(const r of activeDbListeners){try{r.off()}catch{}}activeDbListeners=[];for(const oid of orgIds){for(const node of ['exams','results']){const ref=fbDb.ref(`orgData/${oid}/${node}`);activeDbListeners.push(ref);ref.on('value',snap=>{if(!cloudReady)return;const key=node==='exams'?'ef_exams':'ef_results',all=read(key,[]).filter(x=>x.orgId!==oid);const fresh=vals(snap.val()).map(x=>({...x,orgId:x.orgId||oid}));localStorage.setItem(key,JSON.stringify([...all,...fresh]));localStorage.setItem('ef_cloud_snapshot_'+key,JSON.stringify(read(key,[])));if(session&&(view==='results'||view==='dashboard'||view==='exams'))renderPage()})}}}
async function cloudLoadForUser(meta){cloudReady=false;cloudMeta=meta;const orgSnap=meta.role==='superadmin'?await fbDb.ref('organizations').once('value'):await fbDb.ref('organizations/'+meta.orgId).once('value');let orgVal=orgSnap.val();let orgs=meta.role==='superadmin'?vals(orgVal):orgVal?[orgVal]:[];if(meta.role!=='superadmin'&&orgVal)orgs[0]={...orgVal,id:orgVal.id||meta.orgId};cloudOrgIds=orgs.map(o=>o.id).filter(Boolean);localStorage.setItem('ef_orgs',JSON.stringify(orgs));
 let users=[];if(meta.role==='superadmin'){users=vals((await fbDb.ref('users').once('value')).val())}else if(meta.role==='orgadmin'){users=vals((await fbDb.ref('orgUsers/'+meta.orgId).once('value')).val())}else{users=[meta]};localStorage.setItem('ef_users',JSON.stringify(users));
 let exams=[],results=[];for(const oid of cloudOrgIds){const [es,rs]=await Promise.all([fbDb.ref(`orgData/${oid}/exams`).once('value'),fbDb.ref(`orgData/${oid}/results`).once('value')]);exams.push(...vals(es.val()));results.push(...vals(rs.val()))}
 localStorage.setItem('ef_exams',JSON.stringify(exams));localStorage.setItem('ef_results',JSON.stringify(results));for(const k of ['ef_orgs','ef_users','ef_exams','ef_results'])localStorage.setItem('ef_cloud_snapshot_'+k,JSON.stringify(read(k,[])));cloudReady=true;bindOrgListeners(cloudOrgIds);
}
async function fetchPublicExam(id,orgId){if(!fbDb||!orgId)return null;const s=await fbDb.ref(`orgData/${orgId}/exams/${id}`).once('value');return s.val()}
async function cloudCreateAccount(data){const secondaryName='ExamFlowSecondary';let secondary=firebase.apps.find(a=>a.name===secondaryName);if(!secondary)secondary=firebase.initializeApp(firebaseConfig,secondaryName);const auth=secondary.auth();let cred;try{cred=await auth.createUserWithEmailAndPassword(data.email,data.password)}finally{await auth.signOut().catch(()=>{})}const uid=cred.user.uid;const profile={id:uid,name:data.name,email:data.email,role:data.role,orgId:data.orgId,status:'active',createdAt:Date.now(),createdByRole:cloudMeta.role,examQuota:data.examQuota??null};await fbDb.ref('users/'+uid).set(profile);await fbDb.ref('orgUsers/'+data.orgId+'/'+uid).set(profile);return profile}

let session=null, view='dashboard', activeExam=null, studentAnswers={}, examTimer=null, timeLeft=0, editingExamId=null;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function seed(){/* Firebase mode: never create demo accounts or seed local sample data. */}
function loginScreen(){ $('root').innerHTML=`<div class="login-wrap"><section class="login-art"><div><div class="flex items-center gap-3"><div class="brandmark">E</div><div><div style="font:800 21px Manrope">ExamFlow</div><div style="font-size:12px;color:#c7d2fe">ASSESSMENT MANAGEMENT</div></div></div><div style="margin-top:90px;max-width:530px;position:relative;z-index:1"><div class="pill" style="background:#ffffff20;color:#e0e7ff">SMART EXAM PLATFORM</div><h1 style="font-size:clamp(34px,4vw,54px);line-height:1.2;font-weight:700;margin:22px 0">ออกแบบข้อสอบ<br>จัดสอบ และวัดผล<br><span style="color:#a5b4fc">ในที่เดียว</span></h1><p style="color:#cbd5e1;line-height:1.9">เครื่องมือสำหรับครู โรงเรียน และผู้ดูแลระบบ ตั้งแต่สร้างข้อสอบหลายรูปแบบ ไปจนถึงติดตามผลและตรวจข้อสอบอัตนัย</p></div></div><div style="position:relative;z-index:1;color:#a5b4fc;font-size:12px">EXAMFLOW • ระบบต้นแบบเพื่อการศึกษา</div></section><section class="login-form"><form class="login-box" onsubmit="doLogin(event)"><div class="brandmark" style="margin-bottom:24px">E</div><h2 style="font-size:28px;font-weight:700">ยินดีต้อนรับกลับ</h2><p class="muted" style="font-size:13px;margin:5px 0 28px">เข้าสู่ระบบเพื่อจัดการงานของคุณ</p><label class="label">อีเมล / ชื่อผู้ใช้</label><input id="loginEmail" class="field" autocomplete="username" placeholder="name@school.ac.th" required><label class="label" style="margin-top:16px">รหัสผ่าน</label><input id="loginPass" class="field" type="password" autocomplete="current-password" placeholder="กรอกรหัสผ่าน" required><div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 22px;font-size:12px"><label style="display:flex;align-items:center;gap:7px;color:#667085"><input type="checkbox" id="showPass" onchange="$('loginPass').type=this.checked?'text':'password'"> แสดงรหัสผ่าน</label><label style="display:flex;align-items:center;gap:7px;color:#667085"><input type="checkbox" id="rememberDevice" checked> จดจำอุปกรณ์นี้</label><span class="muted">ไม่มีการกรอกรหัสผ่านล่วงหน้า</span></div><button class="btn primary" style="width:100%;padding:13px">เข้าสู่ระบบ <span>→</span></button><p class="muted" style="font-size:10px;line-height:1.6;margin-top:15px">ระบบเชื่อมต่อ Firebase Authentication และ Realtime Database ต้องกำหนดสิทธิ์ผู้ใช้และ Security Rules ก่อนเริ่มใช้งาน</p></form></section></div>`}
async function doLogin(e){e.preventDefault();if(!fbAuth||!fbDb)return toast('เชื่อมต่อ Firebase ไม่สำเร็จ กรุณาตรวจสอบการตั้งค่า');const email=$('loginEmail').value.trim().toLowerCase(),pass=$('loginPass').value;try{await fbAuth.setPersistence($('rememberDevice')?.checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);const cred=await fbAuth.signInWithEmailAndPassword(email,pass);fbUser=cred.user;const snap=await fbDb.ref('users/'+fbUser.uid).once('value');const u=snap.val();if(!u||u.status==='disabled'||u.status==='deleted'){await fbAuth.signOut();return toast('บัญชีนี้ยังไม่ได้กำหนดสิทธิ์ หรือถูกระงับการใช้งาน')}if(u.role!=='superadmin'){const os=await fbDb.ref('organizations/'+u.orgId).once('value');const ov=os.val();if(!ov||ov.status==='disabled'||(ov.expiresAtEpoch&&Date.now()>ov.expiresAtEpoch)||(!ov.expiresAtEpoch&&ov.expiresAt&&new Date(ov.expiresAt+'T23:59:59')<new Date())){await fbAuth.signOut();return toast('สิทธิ์การใช้งานสิ้นสุดแล้ว กรุณาติดต่อผู้ปล่อยเช่าระบบ')}}await cloudLoadForUser(u);if(!accountIsUsable(u)){await fbAuth.signOut();cloudReady=false;return toast('บัญชีหรือสิทธิ์ของสถาบันถูกระงับหรือหมดอายุ')}session={...u,id:fbUser.uid};view='dashboard';renderApp()}catch(err){console.error(err);toast(firebaseErrorTH(err))}}
function firebaseErrorTH(e){const c=e?.code||'';return ({'auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/user-not-found':'ไม่พบบัญชีผู้ใช้','auth/wrong-password':'รหัสผ่านไม่ถูกต้อง','auth/too-many-requests':'มีการเข้าสู่ระบบผิดหลายครั้ง กรุณาลองใหม่ภายหลัง','auth/network-request-failed':'เชื่อมต่ออินเทอร์เน็ตไม่ได้','auth/operation-not-allowed':'กรุณาเปิด Email/Password ใน Firebase Authentication','auth/email-already-in-use':'อีเมลนี้มีบัญชีแล้ว','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','PERMISSION_DENIED':'Firebase Security Rules ไม่อนุญาตให้ดำเนินการ'})[c]||e?.message||'เกิดข้อผิดพลาดจาก Firebase'}
function logout(){session=null;activeExam=null;cloudReady=false;clearInterval(examTimer);for(const r of activeDbListeners){try{r.off()}catch{}}activeDbListeners=[];if(fbAuth)fbAuth.signOut().catch(()=>{});for(const k of ['ef_users','ef_orgs','ef_exams','ef_results'])localStorage.removeItem(k);loginScreen()}
function renderApp(){if(!session)return loginScreen();let myOrg=session.role==='superadmin'?null:read('ef_orgs',[]).find(o=>o.id===session.orgId);if(myOrg&&(myOrg.status==='disabled'||isOrgExpired(myOrg))){$('root').innerHTML=`<div class="min-h-screen grid place-items-center p-5"><div class="card p-8 text-center" style="max-width:560px"><h1 class="text-2xl font-bold">สิทธิ์การใช้งานสิ้นสุดแล้ว</h1><p class="muted mt-3">หากต้องการใช้งานต่อ กรุณาติดต่อผู้ปล่อยเช่าระบบ</p><button class="btn neutral mt-5" onclick="logout()">ออกจากระบบ</button></div></div>`;return}let nav=[['dashboard','▦','ภาพรวม'],['exams','▤','ชุดข้อสอบ'],['results','◷','ผลสอบ'],['accounts','♙','บัญชีผู้ใช้']];if(session.role==='superadmin')nav.push(['institutions','⌂','สถาบัน']);$('root').innerHTML=`<div class="shell"><aside class="sidebar"><div class="flex items-center gap-3 px-2 mb-9"><div class="brandmark">E</div><div class="brandtext"><div style="font:800 19px Manrope">ExamFlow</div><div style="font-size:10px;color:#8793b1">ASSESSMENT SUITE</div></div></div><div class="navlabel" style="font-size:10px;letter-spacing:1.5px;color:#687493;padding:0 14px 8px">WORKSPACE</div>${nav.map(n=>`<button class="navitem ${view===n[0]?'active':''}" onclick="go('${n[0]}')"><b style="font-size:18px;width:20px">${n[1]}</b><span>${n[2]}</span></button>`).join('')}<div style="flex:1"></div><div class="sidefoot" style="border-top:1px solid #2a334d;padding:16px 10px;font-size:11px;color:#8793b1">โหมด: ${roleName(session.role)}<br><span style="color:#64748b">Firebase Connected</span></div></aside><main class="main"><header class="topbar"><div><div style="font-weight:700">${pageName(view)}</div><div class="muted" style="font-size:11px">พื้นที่ทำงานของ ${esc(session.name)}</div></div><div class="flex items-center gap-3"><div style="text-align:right"><div style="font-size:12px;font-weight:700">${esc(session.name)}</div><div class="muted" style="font-size:10px">${roleName(session.role)}</div></div><button class="btn neutral" onclick="logout()">ออกจากระบบ ↗</button></div></header><div class="content" id="page"></div></main></div>`;renderPage()}
function roleName(r){return ({superadmin:'ผู้ดูแลระบบหลัก',orgadmin:'ผู้ดูแลสถาบัน',teacher:'ครูผู้สอน'})[r]||r}
function pageName(v){return ({dashboard:'ภาพรวมระบบ',exams:'จัดการชุดข้อสอบ',results:'ผลการสอบ',accounts:'บัญชีผู้ใช้',institutions:'จัดการสถาบัน'})[v]||v}
function go(v){if(v==='institutions'&&session.role!=='superadmin')return toast('เฉพาะผู้ดูแลระบบหลัก');view=v;renderApp()}
function scopedExams(){let a=read('ef_exams',[]);if(session.role==='superadmin')return a;if(session.role==='orgadmin')return a.filter(e=>e.orgId===session.orgId);return a.filter(e=>e.ownerId===session.id||(e.orgId===session.orgId&&e.sharing==='organization'))}
function scopedUsers(){let a=read('ef_users',[]).filter(u=>u.status!=='deleted');if(session.role==='superadmin')return a;if(session.role==='orgadmin')return a.filter(u=>u.orgId===session.orgId&&u.role!=='superadmin');return a.filter(u=>u.id===session.id)}
function renderPage(){const p=$('page');if(view==='dashboard')p.innerHTML=dashboardHTML();else if(view==='exams')p.innerHTML=examsHTML();else if(view==='results')p.innerHTML=resultsHTML();else if(view==='accounts')p.innerHTML=accountsHTML();else if(view==='institutions')p.innerHTML=institutionsHTML()}
function dashboardHTML(){let ex=scopedExams(),rs=read('ef_results',[]);if(session.role!=='superadmin')rs=rs.filter(r=>ex.some(e=>e.id===r.examId));let users=scopedUsers();return `<div class="flex justify-between items-start gap-4 mb-6"><div><h1 style="font-size:26px;font-weight:700">สวัสดี, ${esc(session.name)}</h1><p class="muted" style="font-size:13px;margin-top:5px">ภาพรวมการจัดสอบและกิจกรรมล่าสุดของคุณ</p></div><button class="btn primary" onclick="openExamEditor()">＋ สร้างชุดข้อสอบ</button></div><div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6"><div class="card stat"><div class="muted text-xs">ชุดข้อสอบที่ดูแล</div><div class="statnum mt-3">${ex.length}</div><div class="text-xs mt-2" style="color:#4f46e5">ชุดข้อสอบทั้งหมด</div></div><div class="card stat"><div class="muted text-xs">เผยแพร่แล้ว</div><div class="statnum mt-3">${ex.filter(e=>e.status==='published').length}</div><div class="text-xs muted mt-2">พร้อมให้นักเรียนเข้าสอบ</div></div><div class="card stat"><div class="muted text-xs">ส่งคำตอบแล้ว</div><div class="statnum mt-3">${rs.length}</div><div class="text-xs muted mt-2">จำนวนรายการส่งข้อสอบ</div></div><div class="card stat"><div class="muted text-xs">${session.role==='superadmin'?'บัญชีในระบบ':'ผู้ใช้ที่เกี่ยวข้อง'}</div><div class="statnum mt-3">${users.length}</div><div class="text-xs muted mt-2">บัญชีที่คุณมีสิทธิ์ดูแล</div></div></div><div class="grid grid-cols-1 xl:grid-cols-3 gap-5"><section class="card xl:col-span-2"><div class="p-5 flex justify-between items-center"><div><h3 class="font-bold">ชุดข้อสอบล่าสุด</h3><p class="muted text-xs mt-1">เข้าถึงและจัดการข้อสอบของคุณ</p></div><button class="btn soft" onclick="go('exams')">ดูทั้งหมด →</button></div><div class="divider"></div>${ex.slice(0,5).map(e=>examRow(e)).join('')||'<div class="p-8 text-center muted text-sm">ยังไม่มีชุดข้อสอบ กด “สร้างชุดข้อสอบ” เพื่อเริ่มต้น</div>'}</section><section class="card p-5"><h3 class="font-bold">ทางลัด</h3><p class="muted text-xs mt-1 mb-5">เครื่องมือที่ใช้บ่อย</p><button class="btn soft w-full mb-2" onclick="openExamEditor()">＋ สร้างข้อสอบใหม่</button><button class="btn neutral w-full mb-2" onclick="go('results')">▤ ตรวจและดูผลสอบ</button><button class="btn neutral w-full" onclick="go('accounts')">♙ จัดการบัญชีผู้ใช้</button><div class="mt-6 p-4 rounded-xl" style="background:#f6f7ff"><div class="font-bold text-sm">ข้อควรรู้</div><p class="muted text-xs mt-2 leading-6">ข้อสอบอัตนัยจะยังไม่ให้คะแนนอัตโนมัติ ครูต้องตรวจและบันทึกคะแนนด้วยตนเอง</p></div></section></div>`}
function examRow(e){return `<div class="px-5 py-4 flex flex-wrap gap-3 justify-between items-center border-b" style="border-color:#f0f2f6"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl grid place-items-center" style="background:#eef2ff;color:#4f46e5">▤</div><div><div class="font-semibold text-sm">${esc(e.title)}</div><div class="muted text-xs mt-1">${e.questions?.length||0} ข้อ · ${e.duration||60} นาที · ${esc(e.subject||'ไม่ระบุวิชา')}</div></div></div><div class="flex gap-2 items-center"><span class="pill" style="${e.status==='published'?'':'background:#f1f3f7;color:#6b7280'}">${e.status==='published'?'เผยแพร่':'ฉบับร่าง'}</span><button class="btn neutral" onclick="editExam('${e.id}')">แก้ไข</button><button class="btn soft" onclick="examActions('${e.id}')">จัดการ</button></div></div>`}
function examsHTML(){let all=scopedExams(),mine=all.filter(e=>e.ownerId===session.id),shared=all.filter(e=>e.sharing==='organization'&&e.ownerId!==session.id);return `<div class="flex justify-between items-center mb-5"><div><h1 class="text-2xl font-bold">คลังข้อสอบ</h1><p class="muted text-sm mt-1">แยกตามรายวิชา ระดับชั้น และเจ้าของข้อสอบ</p></div><button class="btn primary" onclick="openExamEditor()">＋ สร้างข้อสอบ</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5"><div class="card p-4"><b>ข้อสอบของฉัน</b><p class="muted text-xs mt-1">${mine.length} ชุด</p><div class="mt-3">${mine.map(e=>examRow(e)).join('')||'<p class="muted text-sm">ยังไม่มีข้อสอบส่วนตัว</p>'}</div></div><div class="card p-4"><b>คลังข้อสอบองค์กร</b><p class="muted text-xs mt-1">${shared.length} ชุดที่ผู้อื่นแบ่งปัน</p><div class="mt-3">${shared.map(e=>examRow(e)).join('')||'<p class="muted text-sm">ยังไม่มีข้อสอบที่แบ่งปัน</p>'}</div></div></div><div class="card p-4 mb-5"><b>ตัวกรอง</b><div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3"><input id="examSubjectFilter" class="field" placeholder="ค้นหารายวิชา" oninput="filterExamCards()"><select id="examGradeFilter" class="field" onchange="filterExamCards()"><option value="">ทุกระดับชั้น</option>${['อ.1','อ.2','อ.3','ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3','ม.4','ม.5','ม.6','มหาวิทยาลัย ปี 1','มหาวิทยาลัย ปี 2','มหาวิทยาลัย ปี 3','มหาวิทยาลัย ปี 4'].map(g=>`<option>${g}</option>`).join('')}</select></div></div><div id="examAllCards" class="card">${all.map(e=>`<div class="exam-filter-row" data-subject="${esc(e.subject||'').toLowerCase()}" data-grade="${esc(e.grade||'')}">${examRow(e)}<div class="px-5 pb-3 muted text-xs">วิชา: ${esc(e.subject||'ไม่ระบุ')} · ชั้น: ${esc(e.grade||'ไม่ระบุ')} · เจ้าของ: ${esc(e.createdByName||e.ownerId||'ไม่ระบุ')}</div></div>`).join('')||'<div class="p-12 text-center muted">ยังไม่มีชุดข้อสอบ</div>'}</div>`}function filterExamCards(){let s=($('examSubjectFilter')?.value||'').toLowerCase(),g=$('examGradeFilter')?.value||'';document.querySelectorAll('.exam-filter-row').forEach(r=>r.style.display=(!s||r.dataset.subject.includes(s))&&(!g||r.dataset.grade===g)?'':'none')}
function examActions(id){const e=read('ef_exams',[]).find(x=>x.id===id);if(!e)return;const link=location.href.split(/\?/)[0]+'?exam='+encodeURIComponent(id)+'&org='+encodeURIComponent(e.orgId||''),proctor=location.href.split(/\?/)[0]+'?proctor='+encodeURIComponent(id)+'&org='+encodeURIComponent(e.orgId||'');$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="examActionsModal"><div class="modalbox" style="max-width:480px"><div class="flex justify-between items-center mb-4"><div><h2 class="text-xl font-bold">จัดการชุดข้อสอบ</h2><p class="muted text-sm mt-1">${esc(e.title)}</p></div><button class="btn neutral" onclick="$('examActionsModal').remove()">ปิด</button></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3"><button class="btn soft" onclick="copyExamLink('${id}')">คัดลอกลิงก์สอบ</button><button class="btn neutral" onclick="toggleExamPublish('${id}')">${e.status==='published'?'ยกเลิกเผยแพร่':'เผยแพร่ข้อสอบ'}</button><button class="btn neutral" onclick="previewExam('${id}')">ดูตัวอย่างข้อสอบ</button><button class="btn neutral" onclick="copyProctorLink('${id}')">คัดลอกลิงก์ผู้คุมสอบ</button><button class="btn danger" onclick="deleteExam('${id}')">ลบชุดข้อสอบ</button></div><div class="mt-4 p-3 rounded-xl" style="background:#f8f9fc"><label class="label">ลิงก์สำหรับผู้เข้าสอบ</label><input class="field" readonly value="${esc(link)}" id="examLinkField"><button class="btn primary mt-2 w-full" onclick="copyExamLink('${id}')">คัดลอกลิงก์</button><label class="label mt-4">ลิงก์สำหรับผู้คุมสอบ</label><input class="field" readonly value="${esc(proctor)}"><button class="btn neutral mt-2 w-full" onclick="copyProctorLink('${id}')">คัดลอกลิงก์ผู้คุมสอบ</button><p class="muted text-xs mt-2">การแจ้งเตือนข้ามอุปกรณ์ต้องใช้ฐานข้อมูลกลาง ปัจจุบันเป็นโหมดต้นแบบในเบราว์เซอร์</p></div></div></div>`)}
function copyExamLink(id){const ex=read('ef_exams',[]).find(x=>x.id===id);const link=location.href.split(/\?/)[0]+'?exam='+encodeURIComponent(id)+'&org='+encodeURIComponent(ex?.orgId||'');const fallback=()=>{const el=$('examLinkField');if(el){el.focus();el.select();try{document.execCommand('copy');toast('คัดลอกลิงก์แล้ว')}catch{toast('เลือกและคัดลอกลิงก์ด้วยตนเอง')}}};if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(link).then(()=>toast('คัดลอกลิงก์แล้ว')).catch(fallback);else fallback()}
function toggleExamPublish(id){let e=read('ef_exams',[]).find(x=>x.id===id);if(!e)return;e.status=e.status==='published'?'draft':'published';saveExamList(e);$('examActionsModal')?.remove();renderPage();toast('อัปเดตสถานะข้อสอบแล้ว')}
function previewExam(id){let e=read('ef_exams',[]).find(x=>x.id===id);if(!e)return;let qs=e.questions.map((q,i)=>`<section class="question-card mb-3"><div class="pill mb-2">ข้อ ${i+1}</div><div style="white-space:pre-wrap" class="font-semibold">${esc(q.title)}</div>${q.image?`<img class="image-preview" src="${esc(q.image)}">`:''}${['mcq','multi','image','truefalse'].includes(q.type)?(q.options||[]).map(o=>`<div class="exam-option">${esc(o)}</div>`).join(''):['gridradio','gridcheck'].includes(q.type)?(q.rows||[]).map(r=>`<div class="py-2 border-b">${esc(r)} · ${(q.options||[]).join(' / ')}</div>`).join(''):q.type==='scale'?`<div class="py-3">${q.min} — ${q.max}</div>`:`<div class="p-3 mt-3" style="background:#f8f9fc">ช่องคำตอบตัวอย่าง</div>`}<p class="muted text-xs mt-2">${q.required?'บังคับตอบ':'ไม่บังคับตอบ'} · ${q.points} คะแนน</p></section>`).join('');$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="previewModal"><div class="modalbox ef-watermark-wrap" style="position:relative;overflow:hidden"><div class="ef-watermark" aria-hidden="true">ตัวอย่างข้อสอบ · EXAMFLOW · ตัวอย่างข้อสอบ · EXAMFLOW · ตัวอย่างข้อสอบ · EXAMFLOW</div><div style="position:absolute;right:30px;top:30px;border:2px solid #dc2626;color:#dc2626;padding:6px 14px;transform:rotate(12deg);font-size:15px;font-weight:800;opacity:.35">ตัวอย่าง</div><div class="flex justify-between mb-5"><h2 class="text-xl font-bold">ตัวอย่างข้อสอบ</h2><button class="btn neutral" onclick="$('previewModal').remove()">ปิด</button></div><h3 class="text-2xl font-bold">${esc(e.title)}</h3><p class="muted mt-2" style="white-space:pre-wrap">${esc(e.subtitle||'')}</p><div class="mt-5">${qs}</div></div></div>`)}
function copyProctorLink(id){let ex=read('ef_exams',[]).find(x=>x.id===id);let link=location.href.split(/\?/)[0]+'?proctor='+encodeURIComponent(id)+'&org='+encodeURIComponent(ex?.orgId||'');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(link).then(()=>toast('คัดลอกลิงก์ผู้คุมสอบแล้ว')).catch(()=>prompt('คัดลอกลิงก์ผู้คุมสอบ',link));else prompt('คัดลอกลิงก์ผู้คุมสอบ',link)}
function deleteExam(id){if(!confirm('ยืนยันลบชุดข้อสอบนี้หรือไม่'))return;write('ef_exams',read('ef_exams',[]).filter(x=>x.id!==id));$('examActionsModal')?.remove();renderPage();toast('ลบชุดข้อสอบแล้ว')}
function resultsHTML(){let ex=scopedExams(),filter=new URLSearchParams(location.search).get('resultExam')||'',rs=read('ef_results',[]).filter(r=>ex.some(e=>e.id===r.examId)&&(!filter||r.examId===filter));return `<div class="mb-5"><h1 class="text-2xl font-bold">ผลการสอบ</h1><p class="muted text-sm mt-1">เลือกดูผลสอบแยกตามชุดข้อสอบ</p><div class="mt-4 max-w-xl"><label class="label">ชุดข้อสอบ</label><select class="field" onchange="filterResults(this.value)"><option value="">ชุดข้อสอบทั้งหมด</option>${ex.map(e=>`<option value="${e.id}" ${filter===e.id?'selected':''}>${esc(e.title)}</option>`).join('')}</select></div></div><div class="card table-wrap"><table><thead><tr><th>นักเรียน</th><th>ชุดข้อสอบ</th><th>ส่งเมื่อ</th><th>คะแนนที่ตรวจแล้ว</th><th>สถานะ</th><th>การทำงาน</th></tr></thead><tbody>${rs.map(r=>`<tr><td><b>${esc(r.studentName)}</b><div class="muted text-xs">${esc(r.studentId)}</div></td><td>${esc(ex.find(e=>e.id===r.examId)?.title||'ข้อสอบที่ถูกลบ')}</td><td>${new Date(r.submittedAt).toLocaleString('th-TH')}</td><td>${r.score??'—'} / ${r.maxScore}</td><td><span class="pill" style="background:${r.needsGrading?'#fff4df':'#dcfce7'};color:${r.needsGrading?'#a16207':'#15803d'}">${r.needsGrading?'รอตรวจอัตนัย':'ตรวจแล้ว/ปรนัย'}</span></td><td><button class="btn soft" onclick="gradeResult('${r.id}')">เปิดตรวจ</button>${session.role!=='teacher'?` <button class="btn danger" onclick="deleteResult('${r.id}')">ลบผลสอบ</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:40px;color:#8792a5">ยังไม่มีผู้ส่งข้อสอบ</td></tr>'}</tbody></table></div><div class="mt-5 card p-5"><h3 class="font-bold">วิเคราะห์รายข้อ</h3><p class="muted text-xs mt-1">จำนวนผู้ตอบถูกและผิดจากผลสอบที่มีการบันทึก</p><div class="mt-4 space-y-4">${ex.filter(e=>!filter||e.id===filter).map(e=>`<div class="border-b pb-4"><b>${esc(e.title)}</b>${e.questions.map((q,i)=>{let ar=rs.filter(r=>r.examId===e.id).map(r=>r.answers.find(a=>a.questionId===q.id)).filter(Boolean),correct=ar.filter(a=>Number(a.autoScore)>0).length,wrong=ar.length-correct;return `<div class="mt-3"><div class="flex justify-between text-xs"><span>ข้อ ${i+1}: ${esc(q.title)}</span><span>ถูก ${correct} คน · ผิด ${wrong} คน</span></div><div class="flex h-2 rounded overflow-hidden mt-2" style="background:#fee2e2"><div style="width:${ar.length?correct/ar.length*100:0}%;background:#16a34a"></div></div></div>`}).join('')}</div>`).join('')||'<p class="muted text-sm">ยังไม่มีข้อมูลวิเคราะห์</p>'}</div></div><div class="mt-4"><button class="btn neutral" onclick="exportResults()">ส่งออกผลสอบ CSV</button></div>`}
function filterResults(id){let url=new URL(location.href);if(id)url.searchParams.set('resultExam',id);else url.searchParams.delete('resultExam');history.replaceState({},'',url);renderPage()}
function deleteResult(id){if(session.role==='teacher')return toast('ไม่มีสิทธิ์ลบผลสอบ');if(!confirm('ยืนยันลบรายการผลสอบนี้หรือไม่?'))return;write('ef_results',read('ef_results',[]).filter(r=>r.id!==id));renderPage();toast('ลบรายการผลสอบแล้ว')}
function gradeResult(id){let rs=read('ef_results',[]),r=rs.find(x=>x.id===id);if(!r)return;let exam=read('ef_exams',[]).find(e=>e.id===r.examId);if(!exam)return;let rows=r.answers.map(a=>({a,q:exam.questions.find(q=>q.id===a.questionId)})).filter(x=>x.q);let html=rows.map(({a,q})=>`<div class="question-card mb-3"><div class="font-bold text-sm">${esc(q.title)} <span class="muted">(${q.points} คะแนน)</span></div><div class="text-sm mt-3" style="white-space:pre-wrap">${esc(a.value||'— ไม่ได้ตอบ —')}</div>${!['essay','short','gridradio','gridcheck','scale','date','time'].includes(q.type)?`<div class="mt-3 text-sm" style="color:${a.autoScore>0?'#15803d':'#b91c1c'}"><b>${a.autoScore>0?'ตอบถูก':'ตอบผิด'}</b> · ได้ ${a.autoScore||0}/${q.points} คะแนน${q.explanation?`<p class="mt-1">เฉลย/คำอธิบาย: ${esc(q.explanation)}</p>`:''}</div>`:''}${['essay','short'].includes(q.type)?`<label class="label mt-4">คะแนนที่ได้ (0–${q.points})</label><input class="field grade-score" data-qid="${q.id}" type="number" min="0" max="${q.points}" step="0.5" value="${a.manualScore??''}">`:''}</div>`).join('');$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="gradeModal"><div class="modalbox"><div class="flex justify-between items-center mb-5"><h2 class="text-xl font-bold">ตรวจคำตอบ: ${esc(r.studentName)}</h2><button class="btn neutral" onclick="$('gradeModal').remove()">ปิด</button></div>${html}<button class="btn primary w-full mt-3" onclick="saveGrades('${r.id}')">บันทึกคะแนน</button></div></div>`)}
function saveGrades(id){let rs=read('ef_results',[]),r=rs.find(x=>x.id===id),ex=read('ef_exams',[]).find(e=>e.id===r.examId);if(!r||!ex)return;document.querySelectorAll('.grade-score').forEach(el=>{let a=r.answers.find(a=>a.questionId===el.dataset.qid);a.manualScore=Math.max(0,Math.min(Number(el.max),Number(el.value)||0))});r.score=r.answers.reduce((s,a)=>{let q=ex.questions.find(q=>q.id===a.questionId);return s+(a.manualScore??a.autoScore??0)},0);r.needsGrading=r.answers.some(a=>{let q=ex.questions.find(q=>q.id===a.questionId);return ['essay','short'].includes(q?.type)&&a.manualScore===undefined});write('ef_results',rs);$('gradeModal').remove();renderPage();toast('บันทึกคะแนนแล้ว')}
function exportResults(){let ex=scopedExams(),rs=read('ef_results',[]).filter(r=>ex.some(e=>e.id===r.examId));let csv=[['นักเรียน','รหัส','ข้อสอบ','คะแนน','คะแนนเต็ม','สถานะ'],...rs.map(r=>[r.studentName,r.studentId,ex.find(e=>e.id===r.examId)?.title,r.score,r.maxScore,r.needsGrading?'รอตรวจ':'ตรวจแล้ว'])].map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='exam-results.csv';a.click();URL.revokeObjectURL(a.href)}
function isOrgExpired(o){const t=o?.expiresAtTime?new Date(o.expiresAtTime):o?.expiresAt?new Date(o.expiresAt+'T23:59:59'):null;return !!(t&&t<new Date())}
function orgIsUsable(o){return !!o && o.status!=='disabled' && !isOrgExpired(o)}
function accountIsUsable(u){if(!u||u.status==='disabled')return false;if(u.role==='superadmin')return true;let o=read('ef_orgs',[]).find(x=>x.id===u.orgId);return orgIsUsable(o)}
function teacherExamQuotaReached(u){if(!u||u.role!=='teacher'||u.createdByRole!=='superadmin')return false;let n=read('ef_exams',[]).filter(e=>e.ownerId===u.id).length;return n>=Number(u.examQuota??0)}
async function deleteUser(id){let a=read('ef_users',[]),u=a.find(x=>x.id===id);if(!u||u.role==='superadmin'||id===session.id)return toast('ไม่สามารถลบบัญชีนี้ได้');if(session.role==='orgadmin'&&u.orgId!==session.orgId)return toast('ไม่มีสิทธิ์จัดการบัญชีนี้');if(session.role==='teacher')return toast('ไม่มีสิทธิ์ลบบัญชี');if(!confirm(`ยืนยันระงับและนำบัญชี ${u.name} ออกจากรายการหรือไม่?`))return;u.status='deleted';u.deletedAt=Date.now();await fbDb.ref('users/'+id).update({status:'deleted',deletedAt:u.deletedAt});if(u.orgId)await fbDb.ref('orgUsers/'+u.orgId+'/'+id).update({status:'deleted',deletedAt:u.deletedAt});write('ef_users',a);renderPage();toast('ระงับบัญชีและนำออกจากรายการแล้ว')}

function accountsHTML(){let us=scopedUsers();return `<div class="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h1 class="text-2xl font-bold">บัญชีผู้ใช้</h1><p class="muted text-sm mt-1">${session.role==='superadmin'?'จัดการบัญชีผู้ดูแลสถาบันและครูผู้สอน':'เพิ่มและดูแลบัญชีครูภายในสถาบัน'}</p></div>${session.role!=='teacher'?'<button class="btn primary" onclick="openUserModal()">＋ เพิ่มบัญชี</button>':''}</div><div class="card table-wrap"><table><thead><tr><th>ชื่อแสดง</th><th>ชื่อผู้ใช้สำหรับล็อกอิน</th><th>อีเมลสำหรับกู้คืนบัญชี</th><th>บทบาท</th><th>สถาบัน</th><th>สถานะ</th><th>การจัดการ</th></tr></thead><tbody>${us.map(u=>{let org=read('ef_orgs',[]).find(o=>o.id===u.orgId),usable=accountIsUsable(u);return `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.username||u.loginName||'ยังไม่ได้ตั้ง')}</td><td>${esc(u.email||'—')}</td><td>${roleName(u.role)}</td><td>${esc(org?.name||'—')}</td><td><span class="pill" style="background:${usable?'#dcfce7':'#fff0f0'};color:${usable?'#15803d':'#be123c'}">${usable?'ใช้งาน':'ระงับ/หมดอายุ'}</span></td><td>${u.id!==session.id&&u.role!=='superadmin'?`<div class="flex flex-wrap gap-2"><button class="btn soft" onclick="editUser('${u.id}')">แก้ไข</button><button class="btn neutral" onclick="toggleUser('${u.id}')">${u.status==='disabled'?'เปิดใช้บัญชี':'ระงับบัญชี'}</button><button class="btn neutral" onclick="resetPassword('${u.id}')">ตั้งรหัสใหม่</button><button class="btn danger" onclick="deleteUser('${u.id}')">ลบบัญชี</button></div>`:'บัญชีหลัก'}</td></tr>`}).join('')||'<tr><td colspan="6" class="text-center muted">ยังไม่มีบัญชี</td></tr>'}</tbody></table></div>`}
async function toggleUser(id){let a=read('ef_users',[]),u=a.find(x=>x.id===id);if(!u||u.role==='superadmin'||u.id===session.id)return;if(session.role==='orgadmin'&&u.orgId!==session.orgId)return toast('ไม่มีสิทธิ์จัดการบัญชีนี้');u.status=u.status==='disabled'?'active':'disabled';await fbDb.ref('users/'+id).update({status:u.status});if(u.orgId)await fbDb.ref('orgUsers/'+u.orgId+'/'+id).update({status:u.status});write('ef_users',a);renderPage();toast(u.status==='disabled'?'ระงับบัญชีแล้ว':'เปิดใช้บัญชีแล้ว')}
async function resetPassword(id){let a=read('ef_users',[]),u=a.find(x=>x.id===id);if(!u||u.role==='superadmin'||!(session.role==='superadmin'||u.orgId===session.orgId))return toast('ไม่มีสิทธิ์จัดการบัญชีนี้');if(!confirm(`ส่งลิงก์ตั้งรหัสผ่านใหม่ไปยัง ${u.email} หรือไม่?`))return;try{await fbAuth.sendPasswordResetEmail(u.email);toast('ส่งอีเมลสำหรับตั้งรหัสผ่านใหม่แล้ว')}catch(e){toast(firebaseErrorTH(e))}}

function openUserModal(id){let old=id?read('ef_users',[]).find(x=>x.id===id):null,orgs=read('ef_orgs',[]).filter(o=>session.role==='superadmin'||o.id===session.orgId);if(old&&session.role==='orgadmin'&&old.orgId!==session.orgId)return toast('ไม่มีสิทธิ์จัดการบัญชีนี้');let roles=session.role==='superadmin'?['orgadmin','teacher']:['teacher'];$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="userModal"><form class="modalbox" onsubmit="saveUser(event,'${id||''}')"><div class="flex justify-between mb-5"><h2 class="text-xl font-bold">${old?'แก้ไขบัญชีผู้ใช้':'เพิ่มบัญชีผู้ใช้'}</h2><button type="button" class="btn neutral" onclick="$('userModal').remove()">ปิด</button></div><label class="label">ชื่อ-นามสกุล</label><input class="field mb-3" id="nuName" value="${esc(old?.name||'')}" required><label class="label">อีเมล / ชื่อเข้าสู่ระบบ</label><input class="field mb-3" id="nuEmail" type="email" value="${esc(old?.email||'')}" required><label class="label">บทบาท</label><select class="field mb-3" id="nuRole" ${old?'disabled':''}>${roles.map(r=>`<option value="${r}" ${(old?.role||roles[0])===r?'selected':''}>${roleName(r)}</option>`).join('')}</select><label class="label">สถาบัน</label><input class="field mb-1" id="nuOrg" list="nuOrgOptions" value="${esc(orgs.find(o=>o.id===(old?.orgId||session.orgId||orgs[0]?.id))?.name||'')}" placeholder="พิมพ์ชื่อสถาบัน หรือเลือกจากรายการ" required><datalist id="nuOrgOptions">${orgs.map(o=>`<option value="${esc(o.name)}" data-orgid="${esc(o.id)}"></option>`).join('')}</datalist><p class="muted text-xs mb-3">${session.role==='superadmin'?'พิมพ์ชื่อสถาบันใหม่ได้ ระบบจะสร้างสถาบันให้อัตโนมัติ':'เลือกสถาบันของคุณจากรายการ'}</p>${old?'':`<label class="label">รหัสผ่านเริ่มต้น (อย่างน้อย 8 ตัวอักษร)</label><input class="field mb-3" id="nuPass" type="password" minlength="8" required>${session.role==='superadmin'?'<label class="label">โควตาชุดข้อสอบสำหรับครูรายนี้</label><input class="field mb-5" id="nuQuota" type="number" min="0" value="10" required><p class="muted text-xs mb-3">บัญชีครูที่องค์กรสร้างจะไม่จำกัดโควตา</p>':''}`}<button class="btn primary w-full">${old?'บันทึกการแก้ไข':'สร้างบัญชี'}</button></form></div>`)}
function editUser(id){openUserModal(id)}
async function saveUser(e,id){e.preventDefault();let a=read('ef_users',[]),email=$('nuEmail').value.trim().toLowerCase(),old=id?a.find(x=>x.id===id):null;let orgInput=$('nuOrg').value.trim(),orgs=read('ef_orgs',[]),org=orgs.find(o=>o.id===orgInput||o.name.toLowerCase()===orgInput.toLowerCase());if(!org){if(session.role!=='superadmin')return toast('ไม่พบสถาบันนี้ กรุณาเลือกสถาบันของคุณ');if(!orgInput)return toast('กรุณาพิมพ์ชื่อสถาบัน');let base=orgInput.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'institution';let code=base,n=2;while(orgs.some(o=>String(o.code||'').toLowerCase()===code.toLowerCase()))code=base+'-'+n++;org={id:'org_'+crypto.randomUUID(),name:orgInput,code,quota:500,expiresAtTime:'',expiresAtEpoch:null,expiresAt:'',status:'active',plan:'มาตรฐาน',createdAt:Date.now()};orgs.push(org);try{await fbDb.ref('organizations/'+org.id).set(org);localStorage.setItem('ef_orgs',JSON.stringify(orgs));localStorage.setItem('ef_cloud_snapshot_ef_orgs',JSON.stringify(orgs));}catch(err){console.error(err);return toast('สร้างสถาบันไม่สำเร็จ กรุณาตรวจสอบ Firebase Rules')}}if(old){if(old.role==='superadmin')return toast('ไม่สามารถแก้ไขบัญชีผู้ดูแลระบบหลักได้');if(email!==old.email.toLowerCase())return toast('การเปลี่ยนอีเมลเข้าสู่ระบบต้องเปลี่ยนผ่าน Firebase Authentication ซึ่งยังไม่เปิดให้แก้จากหน้านี้');Object.assign(old,{name:$('nuName').value.trim(),orgId:org.id});await fbDb.ref('users/'+old.id).update({name:old.name,orgId:old.orgId});if(old.orgId)await fbDb.ref('orgUsers/'+old.orgId+'/'+old.id).update({name:old.name,orgId:old.orgId});write('ef_users',a);$('userModal').remove();renderPage();toast('แก้ไขบัญชีแล้ว');return}
 let pass=$('nuPass').value;if(pass.length<8)return toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');const data={name:$('nuName').value.trim(),email,password:pass,role:$('nuRole').value,orgId:org.id,examQuota:session.role==='superadmin'?Number($('nuQuota')?.value||0):null};try{const profile=await cloudCreateAccount(data);a.push(profile);localStorage.setItem('ef_users',JSON.stringify(a));localStorage.setItem('ef_cloud_snapshot_ef_users',JSON.stringify(a));$('userModal').remove();renderPage();toast('สร้างบัญชี Firebase สำเร็จ')}catch(err){console.error(err);toast(firebaseErrorTH(err))}}

function institutionsHTML(){let orgs=read('ef_orgs',[]),users=read('ef_users',[]),exams=read('ef_exams',[]);return `<div class="flex flex-wrap justify-between items-center gap-3 mb-5"><div><h1 class="text-2xl font-bold">สถาบันและโรงเรียน</h1><p class="muted text-sm mt-1">จัดการแพ็กเกจ โควตา วันหมดอายุ และบัญชีครู</p></div><button class="btn primary" onclick="openOrgModal()">＋ เพิ่มโรงเรียน / สถาบัน</button></div><div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5"><div class="card stat"><div class="muted text-xs">สถาบันทั้งหมด</div><div class="statnum mt-2">${orgs.length}</div></div><div class="card stat"><div class="muted text-xs">บัญชีในระบบ</div><div class="statnum mt-2">${users.length}</div></div><div class="card stat"><div class="muted text-xs">ชุดข้อสอบทั้งหมด</div><div class="statnum mt-2">${exams.length}</div></div></div><div class="card table-wrap"><table><thead><tr><th>สถาบัน</th><th>รหัสองค์กร</th><th>บัญชีผู้ใช้</th><th>ชุดข้อสอบ</th><th>โควตาข้อสอบ</th><th>หมดอายุ</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${orgs.map(o=>{let expired=isOrgExpired(o),count=users.filter(u=>u.orgId===o.id).length;return `<tr><td><b>${esc(o.name)}</b><div class="muted text-xs">${esc(o.plan||'มาตรฐาน')}</div></td><td>${esc(o.code)}</td><td>${count}</td><td>${exams.filter(e=>e.orgId===o.id).length}</td><td>${Number(o.quota)||0}</td><td>${o.expiresAt?new Date(o.expiresAt+'T00:00:00').toLocaleDateString('th-TH'):'ไม่กำหนด'}</td><td><span class="pill" style="background:${o.status==='disabled'||expired?'#fff0f0':'#dcfce7'};color:${o.status==='disabled'||expired?'#be123c':'#15803d'}">${expired?'หมดอายุ':o.status==='disabled'?'ระงับ':'ใช้งาน'}</span></td><td><div class="flex flex-wrap gap-2"><button class="btn soft" onclick="editOrg('${o.id}')">แก้ไข</button><button class="btn neutral" onclick="toggleOrg('${o.id}')">${o.status==='disabled'?'เปิดใช้':'ระงับ'}</button><button class="btn neutral" onclick="openUserModalForOrg('${o.id}')">เพิ่มครู</button><button class="btn neutral" onclick="orgReport('${o.id}')">รายงาน</button></div></td></tr>`}).join('')||'<tr><td colspan="8" class="text-center muted">ยังไม่มีสถาบัน</td></tr>'}</tbody></table></div>`}
function openUserModalForOrg(orgId){openUserModal();let sel=$('nuOrg');if(sel)sel.value=orgId;let role=$('nuRole');if(role){role.value='teacher';role.disabled=true}}
function toggleOrg(id){let a=read('ef_orgs',[]),o=a.find(x=>x.id===id);if(!o)return;o.status=o.status==='disabled'?'active':'disabled';write('ef_orgs',a);renderPage();toast(o.status==='disabled'?'ระงับการใช้งานสถาบันแล้ว':'เปิดใช้งานสถาบันแล้ว')}
function openOrgModal(id){let o=id?read('ef_orgs',[]).find(x=>x.id===id):null;$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="orgModal"><form class="modalbox" onsubmit="saveOrg(event,'${id||''}')"><div class="flex justify-between mb-5"><h2 class="text-xl font-bold">${o?'แก้ไขสถาบัน':'เพิ่มโรงเรียน / สถาบัน'}</h2><button type="button" class="btn neutral" onclick="$('orgModal').remove()">ปิด</button></div><label class="label">ชื่อโรงเรียน / สถาบัน</label><input class="field mb-3" id="orgName" value="${esc(o?.name||'')}" required><label class="label">รหัสองค์กร / รหัสสำหรับอ้างอิง</label><input class="field mb-3" id="orgCode" value="${esc(o?.code||'')}" required><label class="label">โควตาชุดข้อสอบที่สร้างได้</label><input class="field mb-3" id="orgQuota" type="number" min="0" value="${o?.quota??500}" required><label class="label">วันและเวลาสิ้นสุดสิทธิ์ใช้งาน</label><input class="field mb-3" id="orgExpiry" type="datetime-local" value="${esc((o?.expiresAtTime||'').slice(0,16))}"><p class="muted text-xs mb-3">เมื่อหมดอายุ ผู้ดูแลระบบจะเห็นสถานะหมดสิทธิ์ นักเรียนจะไม่เห็นข้อความแจ้งเตือนการเช่าใช้งาน</p><label class="label">แพ็กเกจ / ประเภทสิทธิ์ใช้งาน</label><input class="field mb-3" id="orgPlan" value="${esc(o?.plan||'มาตรฐาน')}" required><label class="label">สถานะ</label><select id="orgStatus" class="field mb-5"><option value="active" ${o?.status!=='disabled'?'selected':''}>ใช้งาน</option><option value="disabled" ${o?.status==='disabled'?'selected':''}>ระงับ</option></select><button class="btn primary w-full">บันทึกสถาบัน</button></form></div>`)}
function editOrg(id){openOrgModal(id)}
function saveOrg(e,id){e.preventDefault();let a=read('ef_orgs',[]),code=$('orgCode').value.trim(),o=id?a.find(x=>x.id===id):null;if(a.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id))return toast('รหัสองค์กรนี้ถูกใช้แล้ว');if(!o){o={id:'org_'+crypto.randomUUID()};a.push(o)}Object.assign(o,{name:$('orgName').value.trim(),code,quota:Number($('orgQuota').value),expiresAtTime:$('orgExpiry').value||'',expiresAtEpoch:$('orgExpiry').value?new Date($('orgExpiry').value).getTime():null,expiresAt:$('orgExpiry').value?$('orgExpiry').value.slice(0,10):'',status:$('orgStatus').value,plan:$('orgPlan').value.trim()});write('ef_orgs',a);$('orgModal').remove();renderPage();toast('บันทึกสถาบันแล้ว')}

function openExamEditor(id){if(session.role!=='superadmin'&&!accountIsUsable(session))return toast('สิทธิ์การใช้งานหมดอายุหรือถูกระงับ');if(session.role==='teacher'&&!id&&teacherExamQuotaReached(session))return toast('ใช้โควตาชุดข้อสอบของบัญชีนี้ครบแล้ว กรุณาติดต่อผู้ดูแลระบบ');if(session.role==='orgadmin'&&!id){let org=read('ef_orgs',[]).find(o=>o.id===session.orgId),count=read('ef_exams',[]).filter(x=>x.orgId===session.orgId).length;if(org&&count>=Number(org.quota||0))return toast('ใช้โควตาชุดข้อสอบของสถาบันครบแล้ว กรุณาติดต่อผู้ดูแลระบบ')}editingExamId=id||null;let e=id?read('ef_exams',[]).find(x=>x.id===id):null;const qs=e?.questions||[{id:'q_'+crypto.randomUUID(),type:'mcq',title:'',points:1,options:['','','',''],answer:0}];$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="examModal"><div class="modalbox"><div class="flex justify-between items-center mb-5"><div><h2 class="text-xl font-bold">${e?'แก้ไขชุดข้อสอบ':'สร้างชุดข้อสอบใหม่'}</h2><p class="muted text-xs mt-1">เพิ่มคำถามได้ไม่จำกัดจำนวน และเลือกประเภทแต่ละข้อได้</p></div><button class="btn neutral" onclick="$('examModal').remove()">ปิด</button></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><div><label class="label">ชื่อชุดข้อสอบ *</label><input id="eTitle" class="field" value="${esc(e?.title||'')}" placeholder="เช่น สอบกลางภาค วิทยาศาสตร์"></div><div><label class="label">วิชา / หมวดหมู่</label><input id="eSubject" class="field" value="${esc(e?.subject||'')}" placeholder="วิชา"></div><div><label class="label">ระดับชั้น</label><select id="eGrade" class="field">${['อ.1','อ.2','อ.3','ป.1','ป.2','ป.3','ป.4','ป.5','ป.6','ม.1','ม.2','ม.3','ม.4','ม.5','ม.6','มหาวิทยาลัย ปี 1','มหาวิทยาลัย ปี 2','มหาวิทยาลัย ปี 3','มหาวิทยาลัย ปี 4'].map(g=>`<option value="${g}" ${(e?.grade||'')===g?'selected':''}>${g}</option>`).join('')}</select></div><div><label class="label">การใช้ข้อสอบ</label><select id="eSharing" class="field" ${session.role==='teacher'?'disabled':''}><option value="personal" ${(e?. click="addBuilderQuestion('gridcheck')">＋ ตารางกริดช่องทำเครื่องหมาย</button><button class="btn neutral" onclick="addBuilderQuestion('date')">＋ วันที่</button><button class="btn neutral" onclick="addBuilderQuestion('time')">＋ เวลา</button><button class="btn neutral" onclick="addBuilderQuestion('scale')">＋ สเกลเส้น</button></div></div><div class="flex justify-end gap-2 mt-6 pt-4 divider"><button class="btn neutral" onclick="$('examModal').remove()">ยกเลิก</button><button class="btn primary" onclick="saveExamForm()">บันทึกชุดข้อสอบ</button></div></div></div>`)}
function questionEditor(q,i){let label=({mcq:'ปรนัย',multi:'เลือกหลายคำตอบ',short:'คำตอบสั้น',essay:'อัตนัย',image:'ภาพ/กราฟ',truefalse:'ถูก/ผิด',gridradio:'ตารางกริดหลายตัวเลือก',gridcheck:'ตารางกริดช่องทำเครื่องหมาย',date:'วันที่',time:'เวลา',scale:'สเกลเส้น'})[q.type]||q.type;return `<div class="question-card mb-4" data-qid="${q.id}" data-type="${q.type}"><div class="flex justify-between items-center gap-2 mb-3"><span class="pill">ข้อ <span class="q-number">${i+1}</span> · ${label}</span><button class="btn danger" onclick="this.closest('.question-card').remove();renumberQuestions()">ลบข้อ</button></div><label class="label">โจทย์คำถาม *</label><textarea class="field q-title" rows="2" placeholder="พิมพ์โจทย์คำถาม">${esc(q.title||'')}</textarea><label class="flex items-center gap-2 mt-3 text-sm"><input type="checkbox" class="q-required" ${q.required?'checked':''}> บังคับตอบข้อนี้</label><div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3"><div><label class="label">คะแนนเต็ม</label><input class="field q-points" type="number" min="0" step="0.5" value="${q.points??1}"></div><div class="md:col-span-2"><label class="label">ภาพประกอบ / กราฟ (URL หรืออัปโหลด)</label><div class="flex gap-2"><input class="field q-image" value="${esc(q.image||'')}" placeholder="https://..."><label class="btn neutral">เลือกรูป<input type="file" accept="image/*" class="hidden q-file" onchange="loadQuestionImage(this)"></label></div>${q.image?`<img class="image-preview q-preview" src="${esc(q.image)}">`:'<img class="image-preview q-preview hidden">'}<p class="muted text-xs mt-1">ควรใช้ภาพขนาดเล็กเพื่อไม่ให้ข้อมูลเบราว์เซอร์เต็ม</p></div></div>${choiceEditor(q)}<div class="mt-3"><label class="label">คำอธิบายเฉลย</label><textarea class="field q-explanation" rows="2" placeholder="อธิบายเหตุผลของคำตอบ">${esc(q.explanation||'')}</textarea></div></div>`}
function choiceEditor(q){if(['mcq','multi','image','truefalse'].includes(q.type)){let opts=q.type==='truefalse'?['ถูก','ผิด']:(q.options||['','','','']);return `<div class="mt-4"><div class="flex justify-between items-center"><label class="label">ตัวเลือกคำตอบ</label>${q.type!=='truefalse'?'<button type="button" class="btn soft" onclick="addChoice(this)">＋ เพิ่มตัวเลือก</button>':''}</div><div class="choice-list">${opts.map((o,i)=>`<div class="flex items-center gap-2 mt-2 choice-item"><input type="${q.type==='multi'?'checkbox':'radio'}" name="correct_${q.id}" ${Array.isArray(q.answer)?(q.answer.includes(i)?'checked':''):(q.answer===i?'checked':'')} title="กำหนดเฉลย"><input class="field choice-text" value="${esc(o)}" placeholder="ตัวเลือก ${i+1}">${q.type!=='truefalse'?'<button type="button" class="btn danger" onclick="this.parentElement.remove()">ลบ</button>':''}</div>`).join('')}</div><label class="label mt-4">วางตัวเลือกทั้งหมดในช่องเดียว (A–D หรือแต่ละบรรทัดหนึ่งตัวเลือก)</label><textarea class="field paste-choices" rows="3" placeholder="A. ตัวเลือก A&#10;B. ตัวเลือก B&#10;C. ตัวเลือก C&#10;D. ตัวเลือก D"></textarea><button type="button" class="btn soft mt-2" onclick="parsePastedChoices(this)">แยกตัวเลือกอัตโนมัติ</button><p class="muted text-xs mt-2">หลังแยกตัวเลือกแล้ว ให้เลือกช่องด้านหน้าเพื่อกำหนดเฉลย</p></div>`}if(['gridradio','gridcheck'].includes(q.type)){let rows=q.rows||['รายการ 1','รายการ 2','รายการ 3'],cols=q.options||['ตัวเลือก A','ตัวเลือก B','ตัวเลือก C'];return `<div class="mt-4"><label class="label">แถวของตาราง (หนึ่งรายการต่อบรรทัด)</label><textarea class="field q-grid-rows" rows="3">${esc(rows.join('\n'))}</textarea><label class="label mt-3">คอลัมน์ (หนึ่งตัวเลือกต่อบรรทัด)</label><textarea class="field q-grid-cols" rows="3">${esc(cols.join('\n'))}</textarea><p class="muted text-xs mt-2">${q.type==='gridradio'?'เลือกได้หนึ่งคำตอบต่อแถว':'เลือกได้หลายคำตอบต่อแถว'}</p></div>`}if(q.type==='scale')return `<div class="mt-4 grid grid-cols-2 gap-3"><div><label class="label">ค่าต่ำสุด</label><input class="field q-scale-min" type="number" value="${q.min??1}"></div><div><label class="label">ค่าสูงสุด</label><input class="field q-scale-max" type="number" value="${q.max??5}"></div><div><label class="label">คำอธิบายค่าต่ำสุด</label><input class="field q-scale-left" value="${esc(q.leftLabel||'น้อยที่สุด')}"></div><div><label class="label">คำอธิบายค่าสูงสุด</label><input class="field q-scale-right" value="${esc(q.rightLabel||'มากที่สุด')}"></div></div>`;if(['date','time'].includes(q.type))return `<div class="mt-4 p-3 rounded-xl" style="background:#f8f9fc">ผู้สอบจะกรอก${q.type==='date'?'วันที่':'เวลา'}จากตัวเลือกของอุปกรณ์</div>`;return `<div class="mt-4 p-3 rounded-xl" style="background:#f8f9fc"><div class="font-semibold text-sm">${q.type==='essay'?'คำตอบแบบอัตนัย':'คำตอบสั้น'}</div><p class="muted text-xs mt-1">ระบบจะรับคำตอบเป็นข้อความและส่งให้ครูตรวจ</p><label class="label mt-3">เฉลยอ้างอิง (ไม่บังคับ)</label><textarea class="field q-answer" rows="2">${esc(q.answer||'')}</textarea></div>`}
function parsePastedChoices(btn){let card=btn.closest('.question-card'),raw=card.querySelector('.paste-choices').value.trim();if(!raw)return toast('กรุณาวางตัวเลือกก่อน');let lines=raw.split(/\n|\t|\s{2,}/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^(?:[A-Da-d]|[1-9]\d*)\s*[).:：、-]\s*/,'' )).filter(Boolean);if(lines.length<2)return toast('แยกได้ไม่ถึง 2 ตัวเลือก กรุณาวางแต่ละตัวเลือกคนละบรรทัด');let list=card.querySelector('.choice-list');list.innerHTML=lines.map((o,i)=>`<div class="flex items-center gap-2 mt-2 choice-item"><input type="${card.dataset.type==='multi'?'checkbox':'radio'}" name="correct_${card.dataset.qid}" ${i===0?'checked':''}><input class="field choice-text" value="${esc(o)}" placeholder="ตัวเลือก ${i+1}"><button type="button" class="btn danger" onclick="this.parentElement.remove()">ลบ</button></div>`).join('');toast(`แยกตัวเลือก ${lines.length} รายการแล้ว; ตรวจเฉลยก่อนบันทึก`)}
function previewBuilder(){let cards=[...document.querySelectorAll('#builderQuestions .question-card')];let qs=cards.map((c,i)=>({id:c.dataset.qid,type:c.dataset.type,title:c.querySelector('.q-title').value,points:Number(c.querySelector('.q-points').value)||0,image:c.querySelector('.q-image')?.value||'',options:[...c.querySelectorAll('.choice-text')].map(x=>x.value),rows:c.querySelector('.q-grid-rows')?.value.split('\n').filter(Boolean),min:c.querySelector('.q-scale-min')?.value,max:c.querySelector('.q-scale-max')?.value,leftLabel:c.querySelector('.q-scale-left')?.value,rightLabel:c.querySelector('.q-scale-right')?.value,required:c.querySelector('.q-required')?.checked}));let html=qs.map((q,i)=>`<section class="question-card mb-3"><b>ข้อ ${i+1}</b> <span class="muted">${q.points} คะแนน</span><p class="mt-2" style="white-space:pre-wrap">${esc(q.title)}</p>${q.image?`<img class="image-preview" src="${esc(q.image)}">`:''}${q.options?.length?`<div>${q.options.map(o=>`<div class="exam-option">${esc(o)}</div>`).join('')}</div>`:''}${q.rows?.length?`<div>${q.rows.map(r=>`<div class="py-2 border-b">${esc(r)}</div>`).join('')}</div>`:''}<div class="muted text-xs mt-2">${q.required?'ต้องตอบข้อนี้':'ไม่บังคับตอบ'} · โหมดตัวอย่าง ไม่สามารถตอบได้</div></section>`).join('');$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="builderPreviewModal"><div class="modalbox ef-watermark-wrap" style="position:relative;overflow:hidden"><div class="ef-watermark" aria-hidden="true">ตัวอย่างข้อสอบ · EXAMFLOW · ตัวอย่างข้อสอบ · EXAMFLOW · ตัวอย่างข้อสอบ · EXAMFLOW</div><div style="position:absolute;top:36px;right:35px;transform:rotate(12deg);border:2px solid #dc2626;color:#dc2626;padding:7px 16px;font-size:15px;font-weight:800;opacity:.35;pointer-events:none">ตัวอย่าง</div><div class="flex justify-between mb-5"><h2 class="text-xl font-bold">ตัวอย่างข้อสอบ</h2><button class="btn neutral" onclick="$('builderPreviewModal').remove()">ปิด</button></div><h3 class="text-2xl font-bold">${esc($('eTitle').value||'ยังไม่ระบุชื่อชุดข้อสอบ')}</h3><p class="mt-2 muted" style="white-space:pre-wrap">${esc($('eSubtitle').value||'')}</p><div class="mt-5">${html}</div></div></div>`)}
function addBuilderQuestion(type){let q={id:'q_'+crypto.randomUUID(),type,title:'',points:1,required:false,options:type==='truefalse'?['ถูก','ผิด']:(['gridradio','gridcheck'].includes(type)?['ตัวเลือก A','ตัวเลือก B','ตัวเลือก C']:['','','','']),rows:['รายการ 1','รายการ 2','รายการ 3'],answer:type==='multi'?[]:0};$('builderQuestions').insertAdjacentHTML('beforeend',questionEditor(q,document.querySelectorAll('#builderQuestions .question-card').length));renumberQuestions()}
function addChoice(btn){let list=btn.closest('.question-card').querySelector('.choice-list'),q=btn.closest('.question-card'),type=q.dataset.type;let div=document.createElement('div');div.className='flex items-center gap-2 mt-2 choice-item';div.innerHTML=`<input type="${type==='multi'?'checkbox':'radio'}" name="correct_${q.dataset.qid}"><input class="field choice-text" placeholder="ตัวเลือก ${list.children.length+1}"><button class="btn danger" onclick="this.parentElement.remove()">×</button>`;list.appendChild(div)}
function renumberQuestions(){document.querySelectorAll('#builderQuestions .question-card').forEach((q,i)=>q.querySelector('.q-number').textContent=i+1)}
async function loadQuestionImage(inp){let f=inp.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('กรุณาเลือกไฟล์รูปภาพ');try{const data=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=data});const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let out=canvas.toDataURL('image/jpeg',0.78);while(out.length>650000){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(canvas.width*.82));c.height=Math.max(1,Math.round(canvas.height*.82));c.getContext('2d').drawImage(canvas,0,0,c.width,c.height);canvas.width=c.width;canvas.height=c.height;out=canvas.toDataURL('image/jpeg',0.68);if(canvas.width<320)break}let card=inp.closest('.question-card');card.querySelector('.q-image').value=out;let prev=card.querySelector('.q-preview');prev.src=out;prev.classList.remove('hidden');toast('ปรับขนาดรูปอัตโนมัติแล้ว')}catch(err){console.error(err);toast('อ่านรูปภาพไม่สำเร็จ')}}
function saveExamForm(){let title=$('eTitle').value.trim();if(!title)return toast('กรุณาระบุชื่อชุดข้อสอบ');let cards=[...document.querySelectorAll('#builderQuestions .question-card')];if(!cards.length)return toast('ต้องมีอย่างน้อย 1 ข้อ');let questions=[];for(let c of cards){let type=c.dataset.type,qtitle=c.querySelector('.q-title').value.trim(),points=Number(c.querySelector('.q-points').value);if(!qtitle)return toast('มีข้อที่ยังไม่ได้กรอกโจทย์');if(points<0||!Number.isFinite(points))return toast('คะแนนไม่ถูกต้อง');let q={id:c.dataset.qid,type,title:qtitle,points,required:!!c.querySelector('.q-required')?.checked,image:c.querySelector('.q-image')?.value||'',explanation:c.querySelector('.q-explanation').value.trim()};if(['mcq','multi','image','truefalse'].includes(type)){let items=[...c.querySelectorAll('.choice-item')],opts=items.map(x=>x.querySelector('.choice-text').value.trim());if(opts.length<2||opts.some(x=>!x))return toast('ตัวเลือกต้องมีอย่างน้อย 2 ตัวเลือกและกรอกให้ครบ');q.options=opts;q.answer=items.map((x,i)=>x.querySelector('input').checked?i:-1).filter(i=>i>=0);if(!q.answer.length)return toast('กรุณากำหนดเฉลยทุกข้อปรนัย');if(type!=='multi')q.answer=q.answer[0]}else if(['gridradio','gridcheck'].includes(type)){q.rows=c.querySelector('.q-grid-rows').value.split('\n').map(x=>x.trim()).filter(Boolean);q.options=c.querySelector('.q-grid-cols').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!q.rows.length||!q.options.length)return toast('กรุณากรอกแถวและคอลัมน์ของตารางกริด')}else if(type==='scale'){q.min=Number(c.querySelector('.q-scale-min').value);q.max=Number(c.querySelector('.q-scale-max').value);q.leftLabel=c.querySelector('.q-scale-left').value;q.rightLabel=c.querySelector('.q-scale-right').value;if(q.max<=q.min)return toast('ค่าสูงสุดของสเกลต้องมากกว่าค่าต่ำสุด')}else if(['date','time'].includes(type)){q.answer=''}else q.answer=c.querySelector('.q-answer')?.value||'';questions.push(q)}let all=read('ef_exams',[]),old=editingExamId?all.find(x=>x.id===editingExamId):null;let obj={id:editingExamId||'EX-'+crypto.randomUUID().slice(0,8).toUpperCase(),title,subtitle:$('eSubtitle').value,subject:$('eSubject').value.trim(),grade:$('eGrade')?.value||old?.grade||'ม.1',sharing:$('eSharing')?.value||old?.sharing||'personal',createdByName:old?.createdByName||session.name,createdByEmail:old?.createdByEmail||session.email||'',duration:Number($('eDuration').value)||60,shuffle:$('eShuffle').checked,status:$('ePublished').checked?'published':'draft',orgId:old?.orgId||session.orgId||'org1',ownerId:old?.ownerId||session.id,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now(),showAnswers:$('eShowAnswers')?.checked!==false,questions};if(old)all=all.map(x=>x.id===obj.id?obj:x);else all.push(obj);write('ef_exams',all);$('examModal').remove();toast('บันทึกชุดข้อสอบเรียบร้อย');renderPage()}

function studentStart(exam){activeExam=exam;studentAnswers={};let name='';$('root').innerHTML=`<div class="student-shell"><div class="flex justify-between items-center mb-6"><div class="flex items-center gap-3"><div class="brandmark">E</div><div><div style="font:800 20px Manrope">ExamFlow</div><div class="muted text-xs">ระบบทำข้อสอบออนไลน์</div></div></div><span class="pill">รหัสชุดสอบ ${esc(exam.id)}</span></div><div class="card p-6 md:p-9"><div class="pill mb-3">${esc(exam.subject||'แบบทดสอบ')}</div><h1 class="text-2xl md:text-3xl font-bold">${esc(exam.title)}</h1><p class="muted mt-2" style="white-space:pre-wrap">${esc(exam.subtitle||'โปรดกรอกข้อมูลก่อนเริ่มทำข้อสอบ')}</p><div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-6"><div class="p-4 rounded-xl" style="background:#f8f9fc"><div class="muted text-xs">จำนวนข้อ</div><b class="text-xl">${exam.questions.length}</b></div><div class="p-4 rounded-xl" style="background:#f8f9fc"><div class="muted text-xs">เวลาสอบ</div><b class="text-xl">${exam.duration} นาที</b></div><div class="p-4 rounded-xl" style="background:#f8f9fc"><div class="muted text-xs">คะแนนเต็ม</div><b class="text-xl">${exam.questions.reduce((s,q)=>s+q.points,0)}</b></div></div><div class="divider my-6"></div><form onsubmit="beginStudentExam(event)"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="label">รหัสนักเรียน / เลขที่ *</label><input class="field" id="studentId" required autocomplete="off" placeholder="กรอกรหัสประจำตัว"></div><div><label class="label">ชื่อ-นามสกุล *</label><input class="field" id="studentName" required autocomplete="name" placeholder="ชื่อและนามสกุล"></div></div><label class="flex items-start gap-2 mt-5 text-sm"><input type="checkbox" id="studentConfirm" required style="margin-top:5px"><span>ข้าพเจ้ายืนยันข้อมูล และเข้าใจว่าคำตอบจะถูกส่งเมื่อกดส่งข้อสอบ</span></label><button class="btn primary mt-6" style="padding:13px 22px">เริ่มทำข้อสอบ →</button></form></div><p class="muted text-xs text-center mt-5">อย่า function beginStudentExam(e){e.preventDefault();let id=$('studentId').value.trim(),name=$('studentName').value.trim();if(!id||!name)return;activeExam.student={id,name};activeExam.sessionKey='ef_exam_session_'+activeExam.id+'_'+id;let saved=read(activeExam.sessionKey,null);if(saved&&saved.submitted){return toast('รหัสนักเรียนนี้ส่งข้อสอบชุดนี้แล้ว')}if(activeExam.shuffle&&!saved)activeExam.questions=[...activeExam.questions].sort(()=>Math.random()-.5);timeLeft=saved?.timeLeft??activeExam.duration*60;studentAnswers=saved?.answers||{};renderStudentPaper();clearInterval(examTimer);examTimer=setInterval(()=>{timeLeft=Math.max(0,timeLeft-1);let el=$('examClock');if(el)el.textContent=formatTime(timeLeft);write(activeExam.sessionKey,{timeLeft,answers:studentAnswers,student:activeExam.student,startedAt:saved?.startedAt||Date.now()});if(timeLeft<=0){clearInterval(examTimer);submitExam(true)}},1000)}
function formatTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderStudentPaper(){let e=activeExam;document.removeEventListener('visibilitychange',examVisibilityHandler);document.addEventListener('visibilitychange',examVisibilityHandler);window.addEventListener('storage',function(ev){if(ev.key==='ef_exam_lock_'+e.id&&!ev.newValue)$('examLockOverlay')?.remove()});window.addEventListener('pagehide',()=>{if(activeExam&&activeExam.student){let lock={locked:true,examId:activeExam.id,studentId:activeExam.student.id,studentName:activeExam.student.name,at:Date.now(),reason:'ปิดหรือพับหน้าสอบ'};localStorage.setItem('ef_exam_lock_'+activeExam.id,JSON.stringify(lock))}});$('root').innerHTML=`<div class="student-shell"><div class="flex justify-between items-center mb-5"><div><div class="font-bold">${esc(e.title)}</div><div class="muted text-xs mt-1">${esc(e.student.name)} · ${esc(e.student.id)}</div></div><div class="pill" style="background:#fff0f0;color:#be123c">เวลาคงเหลือ <span id="examClock" class="ml-1">${formatTime(timeLeft)}</span></div></div><div class="progress mb-5"><div style="width:0%" id="examProgress"></div></div><form id="answerForm" onsubmit="event.preventDefault();submitExam(false)"><div class="space-y-4">${e.questions.map((q,i)=>studentQuestion(q,i)).join('')}</div><div class="card p-5 mt-5 flex flex-wrap justify-between items-center gap-3"><div class="muted text-sm">ตอบแล้ว <b id="answeredCount">0</b> / ${e.questions.length} ข้อ</div><button class="btn primary" style="padding:13px 20px" type="submit">ส่งข้อสอบและยืนยันคำตอบ →</button></div></form></div>`;updateProgress();let lock=read('ef_exam_lock_'+e.id+'_'+e.student.id,null);if(lock?.locked)renderLockOverlay(lock);if(fbDb&&e.orgId){const lockRef=fbDb.ref(`orgData/${e.orgId}/locks/${e.id}`);lockRef.on('value',snap=>{const current=vals(snap.val()).find(x=>x.locked&&String(x.studentId)===String(e.student.id));if(current)renderLockOverlay(current);else $('examLockOverlay')?.remove()})}for(const q of e.questions){const v=studentAnswers[q.id];if(v===undefined)con function studentQuestion(q,i){let content='';if(['mcq','multi','image','truefalse'].includes(q.type)){content=`<div class="mt-4">${q.options.map((o,j)=>`<label class="exam-option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="ans_${q.id}" value="${j}" ${q.required&&q.type!=='multi'?'required':''} onchange="recordAnswer('${q.id}',this);updateProgress()"><span>${esc(o)}</span></label>`).join('')}</div>`}else if(['gridradio','gridcheck'].includes(q.type)){content=`<div class="table-wrap mt-4"><table><thead><tr><th>รายการ</th>${q.options.map(o=>`<th>${esc(o)}</th>`).join('')}</tr></thead><tbody>${q.rows.map((r,ri)=>`<tr><td>${esc(r)}</td>${q.options.map((o,ci)=>`<td><input type="${q.type==='gridradio'?'radio':'checkbox'}" name="grid_${q.id}_${ri}" value="${ci}" onchange="recordGrid('${q.id}',${ri},this);updateProgress()" aria-label="${esc(r)} ${esc(o)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}else if(q.type==='date'||q.type==='time')content=`<input class="field mt-4" type="${q.type}" ${q.required?'required':''} onchange="recordText('${q.id}',this.value);updateProgress()">`;else if(q.type==='scale')content=`<div class="mt-5"><div class="flex justify-between text-xs muted"><span>${esc(q.leftLabel||'')}</span><span>${esc(q.rightLabel||'')}</span></div><div class="flex flex-wrap justify-between gap-3 mt-3">${Array.from({length:Math.min(21,Number(q.max)-Number(q.min)+1)},(_,k)=>Number(q.min)+k).map(v=>`<label class="text-center text-sm"><input type="radio" name="ans_${q.id}" value="${v}" ${q.required?'required':''} onchange="recordText('${q.id}',this.value);updateProgress()"><div>${v}</div></label>`).join('')}</div></div>`;else content=`<textarea class="field mt-4" rows="${q.type==='essay'?6:3}" ${q.required?'required':''} placeholder="${q.type==='essay'?'เขียนคำตอบโดยอธิบายเหตุผลให้ครบถ้วน':'พิมพ์คำตอบของคุณ'}" oninput="recordText('${q.id}',this.value);updateProgress()"></textarea>`;return `<section class="card p-5 md:p-6"><div class="flex jus async function submitExam(auto){if(!auto){let missing=activeExam.questions.filter(q=>q.required&&!answerHasValue(studentAnswers[q.id]));if(missing.length){toast(`ยังมีข้อบังคับตอบที่ไม่ได้ตอบ ${missing.length} ข้อ`);return}if(!confirm('ยืนยันการส่งข้อสอบ\nเมื่อส่งแล้วจะไม่สามารถแก้ไขคำตอบได้\nต้องการส่งข้อสอบหรือไม่?'))return}clearInterval(examTimer);document.removeEventListener('visibilitychange',examVisibilityHandler);let e=activeExam,score=0,maxScore=0,needs=false,answers=e.questions.map(q=>{let val=studentAnswers[q.id],autoScore=0;if(['mcq','image','truefalse'].includes(q.type)){if(val===q.answer)autoScore=q.points}else if(q.type==='gridradio'||q.type==='gridcheck'||q.type==='scale'||q.type==='date'||q.type==='time'){needs=true}else if(q.type==='multi'){let a=[...(val||[])].sort(),b=[...(q.answer||[])].sort();if(JSON.stringify(a)===JSON.stringify(b))autoScore=q.points}else needs=true;score+=autoScore;maxScore+=q.points;return{questionId:q.id,value:Array.isArray(val)?val.map(i=>q.options[i]).join(', '):(val&&typeof val==='object'?JSON.stringify(val):(typeof val==='number'?q.options?.[val]??String(val):val??'')),rawValue:val,autoScore}});let r={id:'res_'+crypto.randomUUID(),examId:e.id,orgId:e.orgId,studentId:e.student.id,studentName:e.student.name,answers,score,maxScore,needsGrading:needs,submittedAt:Date.now(),autoSubmitted:auto};let rs=read('ef_results',[]);if(rs.some(x=>x.examId===r.examId&&x.studentId===r.studentId)){if(!confirm('รหัสนี้เคยส่งข้อสอบชุดนี้แล้ว ต้องการบันทึกการส่งใหม่ในต้นแบบหรือไม่?')){studentStart(e);return}}rs.push(r);write('ef_results',rs);if(e.sessionKey)write(e.sessionKey,{submitted:true,submittedAt:Date.now(),student:e.student});if(fbDb&&fbAuth?.currentUser&&e.orgId){r.uid=fbAuth.currentUser.uid;try{await fbDb.ref(`orgData/${e.orgId}/results/${r.id}`).set(r)}catch(err){console.error(err);toast('ไม่สามารถบันทึกผลสอบในฐานข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่อก่อนส่งใหม่');return}}await efSaveProgress({status:'ส่งข้อสอบแล้ว',submitted:true,subm async function efResumeStudent(orgId,examId,studentKey,seconds){try{const ref=fbDb.ref(`orgData/${orgId}/progress/${examId}/${studentKey}`),s=await ref.once('value'),v=s.val();if(!v)return toast('ไม่พบสถานะนักเรียน');const timeLeft=seconds;await ref.update({timeLeft,timeExpired:false,status:'ได้รับอนุญาตให้สอบต่อ',resumeVersion:(Number(v.resumeVersion)||0)+1,lastSeen:Date.now()});const lockRef=fbDb.ref(`orgData/${orgId}/locks/${examId}/${studentKey}`),ls=await lockRef.once('value');if(ls.val()?.locked)await unlockCloudExam(orgId,examId,studentKey);toast('เปิดเวลาให้นักเรียนทำต่อแล้ว')}catch(e){toast(firebaseErrorTH(e))}}
async function unlockCloudExam(orgId,examId,lockId){try{const ref=fbDb.ref(`orgData/${orgId}/locks/${examId}/${lockId}`),s=await ref.once('value'),l=s.val();if(!l)return toast('ไม่พบรายการล็อก');await ref.update({locked:false,unlockedAt:Date.now(),unlockedBy:'ผู้คุมสอบ'});await fbDb.ref(`orgData/${orgId}/lockHistory/${examId}/${lockId}`).push({...l,locked:false,event:'unlocked',at:Date.now(),reason:'ปลดล็อกโดยผู้คุมสอบ'});const pr=fbDb.ref(`orgData/${orgId}/progress/${examId}/${lockId}`);await pr.update({locked:false,status:'ปลดล็อกแล้ว',unlockedAt:Date.now()});toast('ปลดล็อกข้อสอบแล้ว')}catch(e){toast(firebaseErrorTH(e))}}
async function saveGrades(id){let rs=read('ef_results',[]),r=rs.find(x=>x.id===id),ex=read('ef_exams',[]).find(e=>e.id===r?.examId);if(!r||!ex)return;document.querySelectorAll('.grade-score').forEach(el=>{let a=r.answers.find(a=>a.questionId===el.dataset.qid);if(a)a.manualScore=Math.max(0,Math.min(Number(el.max),Number(el.value)||0))});r.score=r.answers.reduce((sum,a)=>{const q=ex.questions.find(q=>q.id===a.questionId);return sum+(a.manualScore??a.autoScore??0)},0);r.needsGrading=r.answers.some(a=>['essay','short'].includes(ex.questions.find(q=>q.id===a.questionId)?.type)&&a.manualScore===undefined);r.gradedAt=Date.now();r.gradedBy=fbAuth?.currentUser?.uid||session?.id||'';write('ef_results',rs);try{if(fbDb&&r.orgId)await fbDb.ref(`orgData/${r.orgId}/results/${r.id}`).update({answers:r.answers,score:r.score,needsGrading:r.needsGrading,gradedAt:r.gradedAt,gradedBy:r.gradedBy});$('gradeModal')?.remove();renderPage();toast('บันทึกคะแนนแล้ว')}catch(err){console.error(err);toast('บันทึกในเครื่องแล้ว แต่ซิงก์ Firebase ไม่สำเร็จ: '+firebaseErrorTH(err))}}
