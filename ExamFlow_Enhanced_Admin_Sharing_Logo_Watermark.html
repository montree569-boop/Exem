gradeResult=function(id){let rs=read('ef_results',[]),r=rs.find(x=>x.id===id);if(!r)return;let exam=read('ef_exams',[]).find(e=>e.id===r.examId);if(!exam)return;let rows=exam.questions.map(q=>({q,a:r.answers.find(a=>a.questionId===q.id)||{questionId:q.id,value:'',autoScore:0}}));let html=rows.map(({a,q})=>`<div class="question-card mb-3"><div class="font-bold text-sm">${esc(q.title)} <span class="muted">(${q.points} คะแนน)</span></div><div class="text-sm mt-3" style="white-space:pre-wrap">${esc(a.value||'— ไม่ได้ตอบ —')}</div>${['essay','short','gridradio','gridcheck','scale','date','time'].includes(q.type)?`<label class="label mt-4">คะแนนที่ได้ (0–${q.points})</label><input class="field grade-score" data-qid="${q.id}" type="number" min="0" max="${q.points}" step="0.5" value="${a.manualScore??''}" placeholder="กรอกคะแนนที่ตรวจได้">`:`<div class="mt-3 text-sm">คะแนนอัตโนมัติ ${a.autoScore??0}/${q.points}</div>`}<button class="btn danger mt-3" onclick="efDeleteAnswer('${r.id}','${q.id}')">ลบคำตอบข้อนี้</button></div>`).join('');$('root').insertAdjacentHTML('beforeend',`<div class="modal" id="gradeModal"><div class="modalbox"><div class="flex justify-between items-center mb-5"><div><h2 class="text-xl font-bold">ตรวจคำตอบ: ${esc(r.studentName)}</h2><p class="muted text-xs mt-1">คะแนนของนักเรียนคนนี้เป็นของครู/บัญชีที่ดูแลผลสอบนี้</p></div><button class="btn neutral" onclick="$('gradeModal').remove()">ปิด</button></div>${html}<button class="btn primary w-full mt-3" onclick="saveGrades('${r.id}')">บันทึกคะแนน</button></div></div>`)};
async function efDeleteAnswer(resultId,qid){if(!confirm('ลบคำตอบข้อนี้ของนักเรียนใช่หรือไม่?'))return;let rs=read('ef_results',[]),r=rs.find(x=>x.id===resultId);if(!r)return;const a=r.answers.find(x=>x.questionId===qid);if(a){a.value='';a.rawValue='';a.autoScore=0;delete a.manualScore;}r.score=r.answers.reduce((sum,x)=>sum+(Number(x.manualScore??x.autoScore)||0),0);r.maxScore=Number(r.maxScore)||0;r.needsGrading=true;r.updatedAt=Date.now();write('ef_results',rs);if(!efTrialMode&&fbDb&&r.orgId){try{await fbDb.ref(`orgData/${r.orgId}/results/${r.id}`).update({answers:r.answers,score:r.score,needsGrading:true,updatedAt:r.updatedAt})}catch(err){toast('ลบในเครื่องแล้ว แต่ซิงก์ไม่สำเร็จ')}}$('gradeModal')?.remove();gradeResult(resultId)};
saveGrades=async function(id){let rs=read('ef_results',[]),r=rs.find(x=>x.id===id),ex=read('ef_exams',[]).find(e=>e.id===r?.examId);if(!r||!ex)return;document.querySelectorAll('.grade-score').forEach(el=>{let a=r.answers.find(a=>a.questionId===el.dataset.qid);if(!a)return;const n=Number(el.value);if(el.value.trim()!==''&&Number.isFinite(n))a.manualScore=Math.max(0,Math.min(Number(el.max),n));else delete a.manualScore});r.score=r.answers.reduce((sum,a)=>sum+(Number(a.manualScore??a.autoScore)||0),0);r.needsGrading=r.answers.some(a=>{const q=ex.questions.find(q=>q.id===a.questionId);return ['essay','short','gridradio','gridcheck','scale','date','time'].includes(q?.type)&&a.manualScore===undefined});r.gradedAt=Date.now();r.gradedBy=session?.id||'';write('ef_results',rs);try{if(!efTrialMode&&fbDb&&r.orgId)await fbDb.ref(`orgData/${r.orgId}/results/${r.id}`).update({answers:r.answers,score:r.score,needsGrading:r.needsGrading,gradedAt:r.gradedAt,gradedBy:r.gradedBy});$('gradeModal')?.remove();renderPage();toast(efTrialMode?'บันทึกคะแนนตัวอย่างแล้ว (ไม่ใช่คะแนนจริง)':'บันทึกคะแนนแล้ว')}catch(err){toast('บันทึกในเครื่องแล้ว แต่ซิงก์ Firebase ไม่สำเร็จ')}};
/* Share-code publishing/importing: question copies only; each teacher keeps independent results. */
const efOldExamsHTML=examsHTML;
examsHTML=function(){return `<div class="card p-5 mb-5"><div class="flex items-start gap-3"><div style="width:42px;height:42px;border-radius:12px;background:#eef2ff;color:#4338ca;display:grid;place-items:center;flex-shrink:0"><i data-lucide="share-2"></i></div><div><h3 class="font-bold">แบ่งปันชุดข้อสอบข้ามโรงเรียน</h3><p class="muted text-sm mt-1">ผู้รับใช้รหัสเพื่อสร้างสำเนาข้อสอบในบัญชีตัวเอง คะแนนและข้อมูลนักเรียนจะไม่ถูกส่งไปด้วย</p></div></div><div class="grid md:grid-cols-2 gap-4 mt-4"><div class="p-4 rounded-xl" style="background:#f8fafc;border:1px solid #e2e8f0"><div class="font-semibold mb-2">1. ส่งข้อสอบให้โรงเรียนอื่น</div><label class="label">เลือกข้อสอบของคุณ</label><select id="efShareExamId" class="field"><option value="">เลือกชุดข้อสอบที่ต้องการแบ่งปัน</option>${scopedExams().map(e=>`<option value="${e.id}">${esc(e.title)} (${esc(e.examCode||e.id)})</option>`).join('')}</select><button class="btn primary mt-3 w-full" onclick="efCreateShareCode()"><i data-lucide="link" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:6px"></i>สร้างรหัสและคัดลอก</button><p class="muted text-xs mt-2">ส่งรหัสที่ได้ให้ครูผู้รับได้ทันที</p></div><div class="p-4 rounded-xl" style="background:#f8fafc;border:1px solid #e2e8f0"><div class="font-semibold mb-2">2. รับข้อสอบจากโรงเรียนอื่น</div><label class="label">รหัสที่ได้รับ</label><input id="efImportCode" class="field" placeholder="เช่น EF-AB12CD34EF" autocapitalize="characters"><button class="btn soft mt-3 w-full" onclick="efImportShareCode()"><i data-lucide="download" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:6px"></i>นำเข้าชุดข้อสอบ</button><p class="muted text-xs mt-2">ข้อสอบจะเข้าเป็นฉบับร่าง แก้ไขก่อนเผยแพร่ได้</p></div></div><p id="efShareMessage" class="muted text-sm mt-3"></p></div>`+efOldExamsHTML()};
async function efCreateShareCode(){let id=$('efShareExamId')?.value.trim();if(!id){const ex=scopedExams()[0];if(ex){id=ex.id;$('efShareExamId').value=id}else return toast('กรอกรหัสชุดข้อสอบก่อน')}let ex=scopedExams().find(x=>x.id===id);if(!ex)return toast('ไม่พบข้อสอบในพื้นที่ของคุณ');const code='EF-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();const payload={code,title:ex.title,subject:ex.subject,grade:ex.grade,subtitle:ex.subtitle,duration:ex.duration,shuffle:ex.shuffle,questions:ex.questions,showAnswers:ex.showAnswers??false,createdAt:Date.now(),createdBy:session?.id};try{if(!efTrialMode&&fbDb)await fbDb.ref('sharedExamCodes/'+code.replace(/[^A-Z0-9-]/g,'')).set(payload);let codes=read('ef_share_codes',{});codes[code]=payload;write('ef_share_codes',codes);$('efShareMessage').textContent='รหัสแชร์: '+code+' — ส่งรหัสนี้ให้ครูคนอื่นได้ (คะแนนไม่แชร์)';if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(code).catch(()=>{});toast('สร้างรหัสแชร์แล้ว')}catch(err){toast('สร้างรหัสไม่สำเร็จ ตรวจสอบสิทธิ์ Firebase')}}
async function efImportShareCode(){let code=($('efImportCode')?.value||'').trim().toUpperCase();if(!code)return toast('กรอกรหัสแชร์ก่อน');let payload=read('ef_share_codes',{})[code];if(!payload&&!efTrialMode&&fbDb){try{payload=(await fbDb.ref('sharedExamCodes/'+code.replace(/[^A-Z0-9-]/g,'')).once('value')).val()}catch(e){}}if(!payload?.questions?.length)return toast('ไม่พบรหัสนี้ หรือผู้แชร์ยังไม่ได้เผยแพร่');let obj={...payload,id:'EX-'+crypto.randomUUID().slice(0,8).toUpperCase(),ownerId:session.id,createdByName:session.name,orgId:session.orgId,sharing:efPracticeMode==='organization'?'organization':'personal',status:'draft',createdAt:Date.now(),updatedAt:Date.now(),importedFrom:code,questions:JSON.parse(JSON.stringify(payload.questions))};delete obj.code;let all=read('ef_exams',[]);all.push(obj);write('ef_exams',all);toast('นำเข้าชุดข้อสอบแล้ว คะแนนจะเริ่มแยกในบัญชีของคุณ');renderPage()}

const efOldDashboardHTML=dashboardHTML;
dashboardHTML=function(){let html=efOldDashboardHTML();if(efTrialMode)return `<div class="card p-4 mb-5" style="border:1px solid #fbbf24;background:#fffbeb"><b>โหมดทดลองใช้งาน</b><p class="text-sm mt-1">ข้อมูลจำลองเท่านั้น การส่งข้อสอบและคะแนนไม่ถูกบันทึกเป็นคะแนนจริงใน Firebase</p><button class="btn neutral mt-3" onclick="efModeChoice()">เปลี่ยนพื้นที่ใช้งาน</button></div>`+html;let org=read('ef_orgs',[]).find(o=>o.id===session.orgId),expires=org?.expiresAt||org?.expiresAtTime||org?.expiresAtEpoch;return (expires?`<div class="card p-4 mb-5" style="border:1px solid #c7d2fe"><b>สิทธิ์การใช้งาน</b><p class="muted text-sm mt-1">${isOrgExpired(org)?'หมดอายุแล้ว':'วันหมดอายุ: '+new Date(expires).toLocaleDateString('th-TH')}</p></div>`:'')+html};

const efOldCopyExamLink=copyExamLink;copyExamLink=function(id){if(efTrialMode){const u=new URL(location.href);u.search='';u.searchParams.set('exam',id);u.searchParams.set('org','trial-org');u.searchParams.set('trial','1');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(u.href).then(()=>toast('คัดลอกลิงก์สอบทดลองแล้ว')).catch(()=>prompt('คัดลอกลิงก์สอบทดลอง',u.href));else prompt('คัดลอกลิงก์สอบทดลอง',u.href);return}return efOldCopyExamLink(id)};

const efCloudPublicLoader=loadPublicExamAndProctor;
loadPublicExamAndProctor=async function(id,orgId,isProctor){const p=new URLSearchParams(location.search);if(p.get('trial')==='1'){efTrialMode=true;cloudReady=false;efSeedTrial();const ex=read('ef_exams',[]).find(x=>x.id===id);if(!ex){$('root').innerHTML='<div class="student-shell"><div class="card p-8">ไม่พบชุดข้อสอบทดลอง</div></div>';return}if(!isProctor){studentStart({...ex,orgId:'trial-org'});return}const rs=read('ef_results',[]).filter(x=>x.examId===id);$('root').innerHTML=`<div class="student-shell"><div class="card p-7"><div class="muted text-xs">EXAMFLOW · DEMO PROCTOR</div><h1 class="text-2xl font-bold mt-2">หน้าทดลองผู้คุมสอบ</h1><p class="muted mt-2">${esc(ex.title)}</p><div class="p-3 rounded-xl mt-4" style="background:#fffbeb;color:#92400e">หน้าทดลองเท่านั้น สถานะและคะแนนไม่ถูกส่งเข้า Firebase</div><div class="divider my-5"></div><h2 class="font-bold mb-3">ตัวอย่างผู้เข้าสอบ</h2>${efTrialUsers.slice(0,4).map((u,i)=>`<div class="p-4 rounded-xl border mb-3" style="border-color:#e2e8f0"><div class="flex justify-between gap-2"><div><b>${esc(u[1])}</b><div class="muted text-xs mt-1">รหัส ${u[0]}</div></div><span class="pill">${i===3?'ส่งแล้ว':'กำลังทำข้อสอบ'}</span></div><div class="progress mt-3"><div style="width:${25+i*15}%"></div></div><p class="muted text-xs mt-2">ทำแล้ว ${i+1}/${ex.questions.length} ข้อ · เวลาเหลือ ${formatTime((15-i*2)*60)}</p><button class="btn soft mt-3" onclick="toast('โหมดทดลอง: การล็อก/ปลดล็อกเป็นตัวอย่าง ไม่กระทบผู้สอบจริง')">ทดลองล็อก / ปลดล็อก</button><button class="btn neutral mt-3" onclick="toast('โหมดทดลอง: ต่อเวลาให้ผู้สอบแล้ว (ตัวอย่าง)')">ต่อเวลา</button></div>`).join('')}<h2 class="font-bold mt-5">ผลตัวอย่าง</h2>${rs.map(r=>`<div class="p-3 border-b"><b>${esc(r.studentName)}</b><span class="muted"> — ${r.score}/${r.maxScore}</span></div>`).join('')||'<p class="muted text-sm">ยังไม่มีผลสอบตัวอย่าง</p>'}<button class="btn neutral mt-5" onclick="location.href=location.href.split('?')[0]">กลับหน้าเข้าสู่ระบบ</button></div></div>`;return}return efCloudPublicLoader(id,orgId,isProctor)};


/* ExamFlow production fixes v3: stable exam codes, real cross-account share codes,
   package capacities, demo identities, and role-gated transparent logos. */
const EF_V3_VERSION='3.0';
function efSafeKey(v){return String(v||'').replace(/[.#$\[\]/]/g,'_').slice(0,120)}
function efCreator(ex){return ex?.creatorCredit||ex?.createdByName||'ไม่ระบุผู้สร้าง'}
function efEnsureCodes(){let a=read('ef_exams',[]),changed=false;for(const e of a){if(!e.examCode){e.examCode=e.id||('EF-'+Math.random().toString(36).slice(2,10).toUpperCase());changed=true}if(!e.creatorCredit){e.creatorCredit=e.createdByName||session?.name||'ผู้สร้างข้อสอบ';changed=true}}if(changed)write('ef_exams',a)}
function efPackageForUser(){if(efTrialMode)return efPracticeMode==='organization'?'special':'normal';if(session?.role==='superadmin')return 'special';const org=read('ef_orgs',[]).find(o=>o.id===session?.orgId);return (session?.practiceMode==='organization'||org?.plan==='พิเศษ'||org?.plan==='องค์กร'||org?.package==='special')?'special':'normal'}
function efCapacity(ex){const org=read('ef_orgs',[]).find(o=>o.id===ex?.orgId);return (org?.package==='special'||org?.plan==='พิเศษ'||org?.plan==='องค์กร'||ex?.package==='special'||session?.practiceMode==='organization')?100:50}
function efLogoHTML(){const org=session?.role==='superadmin'?null:read('ef_orgs',[]).find(o=>o.id===session?.orgId);const can=session?.role==='superadmin'||session?.role==='orgadmin';const logo=org?.logoData||read('ef_brand_logo',null);return `<div class="card p-5 mb-5"><div class="flex items-center justify-between gap-3"><div><h3 class="font-bold">โลโก้ระบบ / โรงเรียน</h3><p class="muted text-sm mt-1">ไฟล์ PNG พื้นหลังโปร่งใสเหมาะที่สุด · ครูผู้สอนไม่มีสิทธิ์แก้ไข</p></div>${logo?`<img src="${logo}" alt="โลโก้" style="width:62px;height:62px;object-fit:contain">`:'<div class="brandmark">E</div>'}</div>${can?`<div class="grid md:grid-cols-2 gap-3 mt-4"><div><label class="label">${session.role==='superadmin'?'โลโก้ตัว E ของระบบ':'โลโก้โรงเรียนนี้'}</label><input class="field" id="efLogoFile" type="file" accept="image/png,image/jpeg,image/webp"></div><button class="btn primary self-end" onclick="efSaveLogo()">บันทึกโลโก้</button></div><p class="muted text-xs mt-2">ผู้ดูแลระบบหลักเปลี่ยนโลโก้ระบบและโลโก้โรงเรียนได้ ส่วนผู้ดูแลองค์กรเปลี่ยนได้เฉพาะโลโก้โรงเรียนของตน</p>`:''}</div>`}
async function efSaveLogo(){if(!['superadmin','orgadmin'].includes(session?.role))return toast('ครูผู้สอนไม่มีสิทธิ์แก้ไขโลโก้');const f=$('efLogoFile')?.files?.[0];if(!f)return toast('เลือกไฟล์โลโก้ก่อน');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});if(!String(data).startsWith('data:image/'))return toast('ไฟล์โลโก้ไม่ถูกต้อง');try{if(session.role==='superadmin'){localStorage.setItem('ef_brand_logo',data);if(fbDb)await fbDb.ref('appSettings/brandLogo').set(data)}else{let a=read('ef_orgs',[]),o=a.find(x=>x.id===session.orgId);if(!o)return toast('ไม่พบข้อมูลโรงเรียน');o.logoData=data;write('ef_orgs',a);if(fbDb)await fbDb.ref(`organizations/${o.id}/logoData`).set(data)}toast('บันทึกโลโก้แล้ว');renderPage()}catch(e){console.error(e);toast('บันทึกโลโก้ไม่สำเร็จ กรุณาตรวจสอบ Firebase Rules')}}
const efRenderPageV3=renderPage;
renderPage=function(){efEnsureCodes();efRenderPageV3();if(view==='dashboard'&&session&&['superadmin','orgadmin'].includes(session.role)){const p=$('page');if(p)p.insertAdjacentHTML('afterbegin',efLogoHTML())}efApplyBrandLogo();if(window.lucide)lucide.createIcons()};
const efExamRowV3=examRow;

/* Add stable code + credit on every save; package capacity is attached to each exam. */
const efSaveExamV3=saveExamForm;
saveExamForm=function(){const prior=editingExamId,old=read('ef_exams',[]).find(x=>x.id===prior);efSaveExamV3();let a=read('ef_exams',[]);let e=a.find(x=>x.id===prior)||a[a.length-1];if(e){e.examCode=old?.examCode||e.examCode||e.id;e.creatorCredit=old?.creatorCredit||e.createdByName||session?.name||'ผู้สร้างข้อสอบ';e.createdById=old?.createdById||session?.id||'';e.package=efPackageForUser();write('ef_exams',a)} };
/* Sharing writes a public-to-authenticated lookup record to Firebase, and keeps creator credit. */
efCreateShareCode=async function(){let id=$('efShareExamId')?.value.trim();let ex=scopedExams().find(x=>x.id===id||x.examCode===id);if(!ex){ex=scopedExams()[0];if(ex&&$('efShareExamId'))$('efShareExamId').value=ex.examCode||ex.id}if(!ex)return toast('ไม่พบข้อสอบในพื้นที่ของคุณ');const code='EF-'+crypto.randomUUID().replace(/-/g,'').slice(0,10).toUpperCase();const payload={code,sourceExamId:ex.id,examCode:ex.examCode||ex.id,title:ex.title,subject:ex.subject||'',grade:ex.grade||'',subtitle:ex.subtitle||'',duration:Number(ex.duration)||60,shuffle:!!ex.shuffle,questions:ex.questions||[],showAnswers:ex.showAnswers!==false,creatorCredit:efCreator(ex),createdByName:efCreator(ex),createdById:ex.createdById||ex.ownerId||session.id,createdAt:Date.now()};try{if(!efTrialMode){if(!fbDb||!fbAuth?.currentUser)throw Error('กรุณาเข้าสู่ระบบ Firebase ก่อนแชร์');await fbDb.ref('sharedExamCodes/'+efSafeKey(code)).set(payload)}let codes=read('ef_share_codes',{});codes[code]=payload;write('ef_share_codes',codes);const m=$('efShareMessage');if(m)m.innerHTML=`รหัสสำเนา <b>${code}</b><br>เครดิตผู้สร้าง: ${esc(payload.creatorCredit)} · คะแนนนักเรียนไม่ถูกคัดลอก`;try{await navigator.clipboard.writeText(code)}catch{}if(window.lucide)lucide.createIcons();toast('สร้างรหัสสำเนาข้อสอบแล้ว')}catch(err){console.error(err);toast('แชร์ไม่สำเร็จ: '+(err.message||'ตรวจสอบ Firebase Rules'))}};
efImportShareCode=async function(){let code=($('efImportCode')?.value||'').trim().toUpperCase();if(!code)return toast('กรอกรหัสสำเนาข้อสอบก่อน');let payload=null;try{if(!efTrialMode&&fbDb)payload=(await fbDb.ref('sharedExamCodes/'+efSafeKey(code)).once('value')).val()}catch(e){console.warn('Cloud share lookup failed',e)}payload=payload||read('ef_share_codes',{})[code];if(!payload?.questions?.length)return toast('ไม่พบรหัสนี้ หรือ Firebase Rules ยังไม่อนุญาตให้อ่านรหัสแชร์');const all=read('ef_exams',[]);if(all.some(x=>x.importedFrom===code&&x.ownerId===session.id))return toast('บัญชีนี้นำเข้ารหัสนี้ไปแล้ว');const obj={id:'EX-'+crypto.randomUUID().replace(/-/g,'').slice(0,8).toUpperCase(),examCode:'EX-'+crypto.randomUUID().replace(/-/g,'').slice(0,8).toUpperCase(),title:payload.title||'สำเนาข้อสอบ',subject:payload.subject||'',grade:payload.grade||'ม.1',subtitle:payload.subtitle||'',duration:Number(payload.duration)||60,shuffle:!!payload.shuffle,questions:JSON.parse(JSON.stringify(payload.questions)),showAnswers:payload.showAnswers!==false,status:'draft',sharing:efPracticeMode==='organization'?'organization':'personal',ownerId:session.id,orgId:session.orgId||'trial-personal',createdByName:session.name,createdByEmail:session.email||'',creatorCredit:payload.creatorCredit||payload.createdByName||'ไม่ระบุผู้สร้าง',originalCreatorId:payload.createdById||'',importedFrom:code,createdAt:Date.now(),updatedAt:Date.now(),package:efPackageForUser()};all.push(obj);write('ef_exams',all);if(!efTrialMode&&fbDb&&obj.orgId){try{await fbDb.ref(`orgData/${obj.orgId}/exams/${obj.id}`).set(obj)}catch(err){all.pop();write('ef_exams',all);return toast('นำเข้าไม่สำเร็จ: ตรวจสอบสิทธิ์เขียนข้อสอบใน Firebase')}}toast('นำเข้าสำเนาข้อสอบแล้ว · เครดิตผู้สร้าง: '+obj.creatorCredit);renderPage();if(window.lucide)lucide.createIcons()};

async function efClearExamResults(examId){
 const ex=scopedExams().find(e=>e.id===examId);if(!ex)return toast('ไม่พบข้อสอบหรือไม่มีสิทธิ์จัดการ');
 const current=read('ef_results',[]).filter(r=>r.examId===examId);
 if(!current.length)return toast('ข้อสอบชุดนี้ยังไม่มีคะแนนให้ล้าง');
 const typed=prompt(`ต้องการลบผลสอบและคะแนนทั้งหมด ${current.length} รายการของ “${ex.title}” ใช่หรือไม่?
การดำเนินการนี้ย้อนกลับไม่ได้
พิมพ์ ลบคะแนน เพื่อยืนยัน`);
 if(typed!=='ลบคะแนน')return;
 try{
   if(!efTrialMode&&fbDb&&ex.orgId){const snap=await fbDb.ref(`orgData/${ex.orgId}/results`).once('value');const cloud=snap.val()||{};const updates={};for(const [id,r] of Object.entries(cloud)){if(r?.examId===examId)updates[id]=null;}if(Object.keys(updates).length)await Promise.all(Object.keys(updates).map(id=>fbDb.ref(`orgData/${ex.orgId}/results/${id}`).remove()))}
   write('ef_results',read('ef_results',[]).filter(r=>r.examId!==examId));
   toast(`ล้างผลสอบทั้งหมด ${current.length} รายการแล้ว`);renderPage();
 }catch(err){console.error(err);toast('ล้างคะแนนไม่สำเร็จ: ตรวจสอบสิทธิ์ Firebase Rules')}
}
const efResultsHTMLBeforeClear=resultsHTML;
resultsHTML=function(){const html=efResultsHTMLBeforeClear();const exams=scopedExams();const controls=`<div class="card p-4 mb-4"><h3 class="font-bold">จัดการคะแนนเป็นชุด</h3><p class="muted text-sm mt-1">ลบผลสอบและคะแนนทั้งหมดของข้อสอบหนึ่งชุดในครั้งเดียว โดยไม่ลบตัวข้อสอบ</p><div class="flex flex-wrap gap-2 mt-3"><select id="efClearResultsExam" class="field" style="max-width:520px"><option value="">เลือกชุดข้อสอบ</option>${exams.map(e=>`<option value="${e.id}">${esc(e.title)} — ${read('ef_results',[]).filter(r=>r.examId===e.id).length} รายการ</option>`).join('')}</select><button class="btn danger" onclick="efClearExamResults($('efClearResultsExam').value)">ล้างคะแนนของชุดนี้</button></div></div>`;return controls+html};

/* Package labels and logo permissions for organizations. */
const efOpenOrgModalV3=openOrgModal;
openOrgModal=function(id){efOpenOrgModalV3(id);const o=id?read('ef_orgs',[]).find(x=>x.id===id):null;const plan=$('orgPlan');if(plan){const val=(o?.package==='special'||['พิเศษ','องค์กร'].includes(o?.plan))?'special':'normal';plan.outerHTML=`<select class="field mb-3" id="orgPlan" required><option value="ธรรมดา" ${val==='normal'?'selected':''}>ธรรมดา — ครูใช้คนเดียว (สอบพร้อมกัน 50 คน)</option><option value="พิเศษ" ${val==='special'?'selected':''}>พิเศษ — องค์กร/โรงเรียน (สอบพร้อมกัน 100 คน)</option></select>`}const form=$('orgModal')?.querySelector('form');if(form&&o?.logoData){form.insertAdjacentHTML('beforeend',`<div class="mb-4"><label class="label">โลโก้โรงเรียนปัจจุบัน</label><img src="${o.logoData}" style="width:70px;height:70px;object-fit:contain"><p class="muted text-xs">เปลี่ยนโลโก้ได้จากหน้าแดชบอร์ดของผู้ดูแลระบบหลักหรือผู้ดูแลองค์กร</p></div>`)}};
const efSaveOrgV3=saveOrg;
saveOrg=function(e,id){e.preventDefault();let a=read('ef_orgs',[]),code=$('orgCode').value.trim(),o=id?a.find(x=>x.id===id):null;if(a.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id))return toast('รหัสองค์กรนี้ถูกใช้แล้ว');if(!o){o={id:'org_'+crypto.randomUUID()};a.push(o)}const plan=$('orgPlan').value;Object.assign(o,{name:$('orgName').value.trim(),code,quota:Number($('orgQuota').value),expiresAtTime:$('orgExpiry').value||'',expiresAtEpoch:$('orgExpiry').value?new Date($('orgExpiry').value).getTime():null,expiresAt:$('orgExpiry').value?$('orgExpiry').value.slice(0,10):'',status:$('orgStatus').value,plan,package:plan==='พิเศษ'?'special':'normal',concurrentLimit:plan==='พิเศษ'?100:50});write('ef_orgs',a);if(!efTrialMode&&fbDb&&session?.role==='superadmin')fbDb.ref('organizations/'+o.id).update(o).catch(err=>{console.error(err);toast('บันทึก Firebase ไม่สำเร็จ กรุณาตรวจสอบ Rules')});$('orgModal').remove();renderPage();toast('บันทึกสถาบันและแพ็กเกจแล้ว')};
/* Fake demo organization accounts are visible in trial, but are never Firebase accounts. */
const efAccountsHtmlV3=accountsHTML;
accountsHTML=function(){let h=efAccountsHtmlV3();if(efTrialMode&&efPracticeMode==='organization'){h+=`<div class="card p-5 mt-5"><h3 class="font-bold">บัญชีตัวอย่างในองค์กร (ข้อมูลจำลอง)</h3><p class="muted text-xs mt-1">บัญชีเหล่านี้ใช้สาธิตหน้าระบบเท่านั้น ไม่สามารถเข้าสู่ระบบจริง</p><div class="table-wrap mt-3"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อแสดง</th><th>บทบาท</th><th>สถานะ</th></tr></thead><tbody>${[['teacher01','ครูพิมพ์ชนก ใจดี'],['teacher02','ครูธนกฤต แสงทอง'],['teacher03','ครูณัฐธิดา มีสุข'],['teacher04','ครูกิตติพงษ์ คำแก้ว'],['teacher05','ครูวรัญญา ใจกล้า'],['teacher06','ครูภัทรพล อินทร์คำ'],['teacher07','ครูศิริพร บุญมี'],['teacher08','ครูอนุชา แสนดี']].map((u,i)=>`<tr><td>${u[0]}</td><td>${u[1]}</td><td>${i===0?'ผู้ดูแลองค์กร':'ครูผู้สอน'}</td><td><span class="pill">ข้อมูลจำลอง</span></td></tr>`).join('')}</tbody></table></div></div>`}return h};
/* Trial answers remain usable but never write to real result nodes. */
const efSubmitExamV3=submitExam;
submitExam=async function(auto){if(!efTrialMode){const e=activeExam,s=e?.student;const out=await efSubmitExamV3(auto);if(e&&s&&activeExam!==e)await efReleaseQueueSlot(e,s);return out}const db=fbDb,auth=fbAuth;fbDb=null;try{return await efSubmitExamV3(auto)}finally{fbDb=db;fbAuth=auth}};
/* Concurrent exam queue: first 50 (normal) / 100 (special) enter. Waiting queue is advanced only after a submit frees a slot. */
let efQueueWaitRef=null;
async function efReserveExamSlot(ex,student){if(efTrialMode)return {status:'active'};if(!fbDb||!ex?.orgId)return {status:'active'};const limit=efCapacity(ex),key=efStudentKey(student.id),ref=fbDb.ref(`orgData/${ex.orgId}/queues/${ex.id}`);let result={status:'active'};try{await ref.transaction(q=>{q=q||{active:{},waiting:[]};q.active=q.active||{};q.waiting=Array.isArray(q.waiting)?q.waiting:[];if(q.active[key]?.status==='active'){result={status:'active'};return q}if(q.waiting.some(x=>x.key===key)){result={status:'waiting'};return q}const active=Object.values(q.active).filter(x=>x.status==='active').length;if(active<limit){q.active[key]={key,studentId:student.id,studentName:student.name,status:'active',startedAt:Date.now()};result={status:'active'}}else{q.waiting.push({key,studentId:student.id,studentName:student.name,queuedAt:Date.now(),status:'waiting'});result={status:'waiting',position:q.waiting.length}}return q},undefined,false);const snap=await ref.once('value'),q=snap.val()||{};if(q.active?.[key]?.status==='active')result={status:'active'};else {const i=(q.waiting||[]).findIndex(x=>x.key===key);result={status:'waiting',position:i+1}}return result}catch(err){console.error('queue reservation failed',err);toast('ตรวจสอบคิวไม่สำเร็จ จึงไม่สามารถยืนยันจำนวนผู้เข้าสอบพร้อมกันได้');return {status:'error'}}}
async function efReleaseQueueSlot(ex,student){if(efTrialMode||!fbDb||!ex?.orgId||!student)return;const ref=fbDb.ref(`orgData/${ex.orgId}/queues/${ex.id}`),key=efStudentKey(student.id);try{await ref.transaction(q=>{if(!q)return q;q.active=q.active||{};q.waiting=Array.isArray(q.waiting)?q.waiting:[];if(q.active[key])delete q.active[key];while(q.waiting.length){const next=q.waiting.shift();if(next){q.active[next.key]={...next,status:'active',startedAt:Date.now(),promotedAt:Date.now()};break}}return q})}catch(e){console.warn('release queue failed',e)}}
const efBeginStudentV3=beginStudentExam;
beginStudentExam=async function(e){e.preventDefault();let id=$('studentId')?.value.trim(),name=$('studentName')?.value.trim();if(!id||!name)return;const student={id,name};const sessionKey='ef_exam_session_'+activeExam.id+'_'+id;const saved=read(sessionKey,null);if(saved?.submitted)return toast('รหัสนักเรียนนี้ส่งข้อสอบชุดนี้แล้ว');const reserve=await efReserveExamSlot(activeExam,student);if(reserve.status==='error')return;if(reserve.status==='waiting'){clearInterval(examTimer);const ex=activeExam,limit=efCapacity(ex);$('root').innerHTML=`<div class="student-shell"><div class="card p-8 text-center"><div class="brandmark mx-auto mb-4">⌛</div><h1 class="text-2xl font-bold">กำลังรอคิวเข้าสอบ</h1><p class="muted mt-2">ขณะนี้มีผู้เข้าสอบครบ ${limit} คนแล้ว ระบบจะเปิดให้เมื่อผู้เข้าสอบคนแรกกดส่งข้อสอบ</p><div class="pill mt-4" id="efQueuePosition">ตำแหน่งคิว ${reserve.position||'…'}</div><p class="muted text-sm mt-4">โปรดเปิดหน้านี้ค้างไว้ ระบบจะเริ่มข้อสอบอัตโนมัติเมื่อถึงคิวของคุณ</p></div></div>`;if(efQueueWaitRef)efQueueWaitRef.off();const ref=fbDb.ref(`orgData/${ex.orgId}/queues/${ex.id}`),key=efStudentKey(id);efQueueWaitRef=ref;ref.on('value',snap=>{const q=snap.val()||{},a=q.active||{},w=q.waiting||[];if(a[key]?.status==='active'){ref.off();efQueueWaitRef=null;activeExam=ex;const sid=$('studentId');if(!sid){activeExam.student=student;activeExam.sessionKey=sessionKey;studentAnswers=saved?.answers||{};timeLeft=saved?.timeLeft??activeExam.duration*60;if(activeExam.shuffle&&!saved)activeExam.questions=[...activeExam.questions].sort(()=>Math.random()-.5);renderStudentPaper();clearInterval(examTimer);examTimer=setInterval(efTick,1000);efSaveProgress({status:'กำลังทำข้อสอบ'});return}efBeginStudentV3({preventDefault(){}});return}const pos=w.findIndex(x=>x.key===key);const el=$('efQueuePosition');if(el)el.textContent=pos>=0?'ตำแหน่งคิว '+(pos+1):'กำลังจัดคิว…'}) ;return}return efBeginStudentV3({preventDefault(){}})};

const efLoginScreenV3=loginScreen;

function efApplyBrandLogo(){const org=session?.role==='superadmin'?null:read('ef_orgs',[]).find(o=>o.id===session?.orgId);const logo=org?.logoData||read('ef_brand_logo',null);if(!logo)return;document.querySelectorAll('.sidebar .brandmark,.login-art .brandmark,.login-box > .brandmark,.topbar .brandmark,.student-shell .brandmark,.shell .brandmark').forEach(el=>{el.innerHTML=`<img src="${logo}" alt="ExamFlow logo" style="width:100%;height:100%;object-fit:contain;padding:4px">`;el.style.background='transparent';el.style.overflow='hidden'});document.querySelectorAll('.topbar').forEach(el=>{if(!el.querySelector('.brandmark'))el.insertAdjacentHTML('afterbegin',`<div class="brandmark" style="width:36px;height:36px;flex-shrink:0;margin-right:12px"><img src="${logo}" alt="ExamFlow logo" style="width:100%;height:100%;object-fit:contain;padding:3px"></div>`)});document.querySelectorAll('.student-shell').forEach(el=>{if(!el.querySelector('.ef-page-logo'))el.insertAdjacentHTML('afterbegin',`<div class="ef-page-logo" style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><img src="${logo}" alt="โลโก้" style="width:48px;height:48px;object-fit:contain"><span style="font-weight:700">ExamFlow</span></div>`)})}

if(fbDb){fbDb.ref('appSettings/brandLogo').once('value').then(snap=>{const v=snap.val();if(v&&String(v).startsWith('data:image/')){localStorage.setItem('ef_brand_logo',v);if(!session)loginScreen();else efApplyBrandLogo()}}).catch(()=>{});}
